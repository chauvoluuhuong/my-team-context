<div id="root" class="panel-app">
  <div class="loading">Loading Team Context…</div>
</div>

<style>
  :root {
    --bg: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --ok-bg: #ecfdf5;
    --ok-fg: #059669;
    --warn-bg: #fffbeb;
    --warn-fg: #d97706;
    --err-bg: #fef2f2;
    --err-fg: #dc2626;
    --code-bg: #f8fafc;
    --card-bg: #ffffff;
    --card-hover: #f1f5f9;
    --card-selected: #f0fdf4;
    --card-selected-border: #86efac;
    --border: #cbd5e1;
    --purple-bg: #f3e8ff;
    --purple-fg: #7e22ce;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f19;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --line: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #172554;
      --ok-bg: #064e3b;
      --ok-fg: #34d399;
      --warn-bg: #78350f;
      --warn-fg: #fbbf24;
      --err-bg: #7f1d1d;
      --err-fg: #f87171;
      --code-bg: #111827;
      --card-bg: #111827;
      --card-hover: #1e293b;
      --card-selected: #062e24;
      --card-selected-border: #059669;
      --border: #334155;
      --purple-bg: #3b0764;
      --purple-fg: #d8b4fe;
    }
  }

  * {
    box-sizing: border-box;
  }

  .panel-app {
    background: var(--bg);
    color: var(--fg);
    font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    max-width: 720px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  h2 {
    font-size: 16.5px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--code-bg);
    border: 1px solid var(--line);
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-signout {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--err-fg);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-signout:hover {
    background: var(--err-bg);
    border-color: var(--err-fg);
  }

  /* Two-Tier Navigation */
  .top-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }

  .top-tab {
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .top-tab:hover {
    color: var(--fg);
    background: var(--card-hover);
  }

  .top-tab.active {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* Sub-session Pills */
  .sub-pills {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .sub-pill {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sub-pill:hover {
    color: var(--fg);
    border-color: var(--accent);
  }

  .sub-pill.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .section-intro {
    margin-bottom: 14px;
  }

  .section-intro h3 {
    margin: 0 0 4px;
    font-size: 14.5px;
    font-weight: 600;
  }

  .section-intro p {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* Form & Cards */
  .card {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px;
    margin-bottom: 12px;
    background: var(--card-bg);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .card-title {
    font-weight: 600;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }

  .field-group:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input[type="text"],
  input[type="password"],
  textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--code-bg);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus,
  input[type="password"]:focus,
  textarea:focus {
    border-color: var(--accent);
  }

  textarea {
    min-height: 180px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    line-height: 1.45;
    resize: vertical;
  }

  /* Buttons */
  button {
    font: inherit;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  button.primary {
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.primary:hover {
    background: var(--accent-hover);
  }

  button.primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  button.secondary {
    background: var(--code-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button.secondary:hover {
    background: var(--card-hover);
  }

  button.secondary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .badge.err { background: var(--err-bg); color: var(--err-fg); }
  .badge.idle { background: var(--code-bg); color: var(--muted); border: 1px solid var(--border); }

  /* Repo List */
  .repo-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
  }

  .repo-search-input {
    flex: 1;
  }

  .repo-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 380px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .repo-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--card-bg);
    transition: all 0.15s ease;
  }

  .repo-item:hover {
    border-color: var(--accent);
  }

  .repo-item.selected {
    border-color: var(--card-selected-border);
    background: var(--card-selected);
  }

  .repo-main-row {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .repo-checkbox {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--accent);
  }

  .repo-name {
    font-weight: 600;
    font-size: 13.5px;
    flex: 1;
    word-break: break-all;
  }

  .repo-desc-box {
    margin-top: 8px;
    padding-left: 26px;
  }

  .status-box {
    margin-top: 14px;
    padding: 9px 12px;
    border-radius: 7px;
    font-size: 12.5px;
    display: none;
  }

  .status-box.ok { display: block; background: var(--ok-bg); color: var(--ok-fg); }
  .status-box.err { display: block; background: var(--err-bg); color: var(--err-fg); }

  .loading {
    color: var(--muted);
    padding: 16px 0;
    text-align: center;
  }
</style>

<script>
  /*__EXT_APPS_BUNDLE__*/
</script>

<script type="module">
  const { App } = globalThis.ExtApps || {};
  const app = new App({ name: "TeamContextApp", version: "0.1.0" }, {}, { autoResize: true });

  const state = {
    activeTopTab: "config", // Defaults to App Configuration
    activeSubSession: "github",  // "github" | "prompt" | "notion" | "database"
    auth: { hasAccount: false, isAuthenticated: false, username: null },
    authMode: "login",
    credentials: {},
    teamStatus: {},
    repos: [],
    reposSearch: "",
    selectedRepos: new Map(),
    systemPrompt: "",
    defaultSystemPrompt: "",
    createdAt: "",
    updatedAt: "",
    statusType: null,
    statusMessage: "",
  };

  const root = document.getElementById("root");

  function esc(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function setStatus(type, msg) {
    state.statusType = type;
    state.statusMessage = msg;
    const box = document.getElementById("statusBox");
    if (box) {
      box.className = "status-box " + (type || "");
      box.textContent = msg || "";
    }
  }

  function setBadge(id, kind, text) {
    const el = document.getElementById("badge-" + id);
    if (el) {
      el.className = "badge " + kind;
      el.textContent = text;
    }
  }

  /* ------------------- Initial Load ------------------- */

  async function loadInitialData() {
    try {
      const [authRes, configRes, appStateRes] = await Promise.all([
        app.callServerTool({ name: "panel_get_auth_state", arguments: {} }).catch(() => null),
        app.callServerTool({ name: "panel_load_config", arguments: {} }).catch(() => null),
        app.callServerTool({ name: "config_get_app_state", arguments: {} }).catch(() => null),
      ]);

      if (authRes) {
        state.auth = JSON.parse(authRes.content[0].text);
      }

      if (configRes) {
        const cfg = JSON.parse(configRes.content[0].text);
        state.credentials = cfg.config || {};
        if (cfg.auth && cfg.auth.isAuthenticated) {
          state.auth = cfg.auth;
        }
      }

      if (appStateRes) {
        const appData = JSON.parse(appStateRes.content[0].text);
        state.repos = appData.repos || [];
        state.defaultSystemPrompt = appData.defaultSystemPrompt || "";
        const appConfig = appData.appConfig || {};
        state.systemPrompt = appConfig.systemPrompt || appData.defaultSystemPrompt || "";
        state.createdAt = appConfig.createdAt || "";
        state.updatedAt = appConfig.updatedAt || "";

        state.selectedRepos.clear();
        (appConfig.activeRepos || []).forEach(r => {
          if (r && r.name) state.selectedRepos.set(r.name, r.description || "");
        });
      }

      // Auto-authenticate if credentials are configured in server/.env
      if (!state.auth.isAuthenticated && state.credentials.AUTH_USERNAME) {
        try {
          const loginRes = await app.callServerTool({
            name: "panel_login",
            arguments: {
              username: state.credentials.AUTH_USERNAME,
              password: state.credentials.AUTH_PASSWORD || "",
            },
          });
          const loginData = JSON.parse(loginRes.content[0].text);
          if (loginData.success) {
            state.auth = { hasAccount: true, isAuthenticated: true, username: loginData.username };
          }
        } catch {}
      }
    } catch (err) {
      console.error("Initial load error:", err);
    }
    render();
  }

  /* ------------------- Render Router ------------------- */

  function render() {
    if (!state.auth.isAuthenticated) {
      renderAuth();
      return;
    }

    root.innerHTML = `
      <div class="header">
        <h2>⚡ Team Context</h2>
        <div class="header-actions">
          <span class="user-badge">👤 ${esc(state.auth.username || "admin")}</span>
          <button class="btn-signout" id="signoutBtn">Sign out</button>
        </div>
      </div>

      <!-- Top-Level Tabs -->
      <div class="top-tabs">
        <button class="top-tab ${state.activeTopTab === "credentials" ? "active" : ""}" id="tabBtnCredentials">
          ⚡ Credentials
        </button>
        <button class="top-tab ${state.activeTopTab === "config" ? "active" : ""}" id="tabBtnConfig">
          ⚙️ App Configuration
        </button>
        <button class="top-tab ${state.activeTopTab === "skills" ? "active" : ""}" id="tabBtnSkills">
          🧠 Skills
        </button>
      </div>

      <!-- Tab Content Area -->
      <div id="tabContent"></div>
    `;

    document.getElementById("signoutBtn")?.addEventListener("click", handleSignout);
    document.getElementById("tabBtnCredentials")?.addEventListener("click", () => switchTopTab("credentials"));
    document.getElementById("tabBtnConfig")?.addEventListener("click", () => switchTopTab("config"));
    document.getElementById("tabBtnSkills")?.addEventListener("click", () => switchTopTab("skills"));

    const contentArea = document.getElementById("tabContent");
    if (state.activeTopTab === "credentials") {
      renderCredentialsTab(contentArea);
    } else if (state.activeTopTab === "config") {
      renderAppConfigTab(contentArea);
    } else if (state.activeTopTab === "skills") {
      renderSkillsTab(contentArea);
    }
  }

  function switchTopTab(tab) {
    state.activeTopTab = tab;
    state.statusType = null;
    state.statusMessage = "";
    render();
  }

  /* ------------------- Auth View ------------------- */

  function renderAuth() {
    const isLogin = state.authMode === "login";
    root.innerHTML = `
      <div class="header">
        <h2>⚡ Team Context</h2>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">🔐 ${isLogin ? "Sign In" : "Create Account"}</span>
        </div>
        <p class="section-intro" style="color:var(--muted);font-size:12.5px;margin-bottom:12px;">
          ${isLogin ? "Enter credentials to access your team configuration." : "Create account credentials stored in server/.env."}
        </p>
        <div class="field-group">
          <label class="field-label" for="authUsername">Username</label>
          <input type="text" id="authUsername" placeholder="username" value="${esc(state.credentials.AUTH_USERNAME || '')}" />
        </div>
        <div class="field-group" style="margin-top:8px;">
          <label class="field-label" for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" value="${esc(state.credentials.AUTH_PASSWORD || '')}" />
        </div>
        <div class="btn-row">
          <button class="primary" id="authSubmitBtn">${isLogin ? "Sign In" : "Create Account"}</button>
          <button class="secondary" id="authToggleBtn">Switch to ${isLogin ? "Create Account" : "Sign In"}</button>
        </div>
        <div id="statusBox"></div>
      </div>
    `;


    document.getElementById("authToggleBtn")?.addEventListener("click", () => {
      state.authMode = state.authMode === "login" ? "register" : "login";
      render();
    });

    document.getElementById("authSubmitBtn")?.addEventListener("click", handleAuthSubmit);
  }

  async function handleAuthSubmit() {
    const username = document.getElementById("authUsername")?.value.trim();
    const password = document.getElementById("authPassword")?.value.trim();
    if (!username || !password) {
      setStatus("err", "Username and password are required.");
      return;
    }
    const toolName = state.authMode === "login" ? "panel_login" : "panel_create_account";
    try {
      const res = await app.callServerTool({ name: toolName, arguments: { username, password } });
      const data = JSON.parse(res.content[0].text);
      if (data.success) {
        state.auth = { hasAccount: true, isAuthenticated: true, username };
        await loadInitialData();
      } else {
        setStatus("err", data.reason || "Authentication failed.");
      }
    } catch (err) {
      setStatus("err", err.message);
    }
  }

  async function handleSignout() {
    try {
      await app.callServerTool({ name: "panel_signout", arguments: {} });
    } catch {}
    state.auth = { hasAccount: true, isAuthenticated: false, username: null };
    render();
  }

  /* ------------------- Tab 1: Credentials ------------------- */

  function renderCredentialsTab(container) {
    const cfg = state.credentials;
    container.innerHTML = `
      <div class="section-intro">
        <h3>⚡ Service Credentials</h3>
        <p>Configure API tokens and connection keys for GitHub, Notion, Vector DB, and SQL database.</p>
      </div>

      <!-- GitHub -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🐙 GitHub</span>
          <span class="badge idle" id="badge-github">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="githubToken">Personal Access Token (classic or fine-grained)</label>
          <input type="password" id="githubToken" placeholder="ghp_… or github_pat_…" value="${esc(cfg.GITHUB_TOKEN || '')}" />
        </div>
      </div>

      <!-- Notion -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">📝 Notion</span>
          <span class="badge idle" id="badge-notion">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="notionKey">Internal Integration Token</label>
          <input type="password" id="notionKey" placeholder="secret_…" value="${esc(cfg.NOTION_API_KEY || '')}" />
        </div>
      </div>

      <!-- Qdrant -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🧠 Qdrant Vector DB</span>
          <span class="badge idle" id="badge-qdrant">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="qdrantUrl">Cluster Endpoint URL</label>
          <input type="text" id="qdrantUrl" placeholder="https://xxx.cloud.qdrant.io" value="${esc(cfg.QDRANT_URL || '')}" />
        </div>
        <div class="field-group" style="margin-top:8px;">
          <label class="field-label" for="qdrantKey">API Key (optional for local clusters)</label>
          <input type="password" id="qdrantKey" placeholder="Qdrant API Key" value="${esc(cfg.QDRANT_API_KEY || '')}" />
        </div>
      </div>

      <!-- Gemini Embeddings -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">✨ Google Gemini Embedding</span>
          <span class="badge idle" id="badge-gemini">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="geminiKey">Gemini API Key (Google AI Studio)</label>
          <input type="password" id="geminiKey" placeholder="AIzaSy…" value="${esc(cfg.GEMINI_API_KEY || '')}" />
        </div>
      </div>

      <!-- SQL Database -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🗄️ SQL Database</span>
          <span class="badge idle" id="badge-sql">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="databaseUrl">Connection URI (PostgreSQL, MySQL, SQLite)</label>
          <input type="text" id="databaseUrl" placeholder="postgresql://user:pass@host:5432/dbname" value="${esc(cfg.DATABASE_URL || '')}" />
        </div>
      </div>

      <div class="btn-row">
        <button class="primary" id="saveCredentialsBtn">Save & Connect</button>
        <button class="secondary" id="testConnectionsBtn">Test Connections</button>
      </div>

      <div id="statusBox" class="${state.statusType ? 'status-box ' + state.statusType : 'status-box'}">${esc(state.statusMessage)}</div>
    `;

    document.getElementById("testConnectionsBtn")?.addEventListener("click", runConnectionTests);
    document.getElementById("saveCredentialsBtn")?.addEventListener("click", saveAllCredentials);
  }

  function getCredentialsFormValues() {
    return {
      GITHUB_TOKEN: document.getElementById("githubToken")?.value.trim() || "",
      NOTION_API_KEY: document.getElementById("notionKey")?.value.trim() || "",
      QDRANT_URL: document.getElementById("qdrantUrl")?.value.trim() || "",
      QDRANT_API_KEY: document.getElementById("qdrantKey")?.value.trim() || "",
      GEMINI_API_KEY: document.getElementById("geminiKey")?.value.trim() || "",
      DATABASE_URL: document.getElementById("databaseUrl")?.value.trim() || "",
    };
  }

  async function runConnectionTests() {
    const vals = getCredentialsFormValues();
    setStatus(null, "");
    setBadge("github", "idle", "Testing…");
    setBadge("notion", "idle", "Testing…");
    setBadge("qdrant", "idle", "Testing…");
    setBadge("gemini", "idle", "Testing…");
    setBadge("sql", "idle", "Testing…");

    let errors = [];

    if (vals.GITHUB_TOKEN) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "github", githubToken: vals.GITHUB_TOKEN } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("github", "ok", "✓ " + (d.login || "Connected"));
        else { setBadge("github", "err", "Failed"); errors.push("GitHub: " + d.reason); }
      } catch (e) { setBadge("github", "err", "Error"); }
    } else setBadge("github", "idle", "Empty");

    if (vals.NOTION_API_KEY) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "notion", notionApiKey: vals.NOTION_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("notion", "ok", "✓ " + (d.botName || "Connected"));
        else { setBadge("notion", "err", "Failed"); errors.push("Notion: " + d.reason); }
      } catch (e) { setBadge("notion", "err", "Error"); }
    } else setBadge("notion", "idle", "Empty");

    if (vals.QDRANT_URL) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "qdrant", qdrantUrl: vals.QDRANT_URL, qdrantApiKey: vals.QDRANT_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("qdrant", "ok", "✓ Connected (" + (d.collectionsCount || 0) + " col)");
        else { setBadge("qdrant", "err", "Failed"); errors.push("Qdrant: " + d.reason); }
      } catch (e) { setBadge("qdrant", "err", "Error"); }
    } else setBadge("qdrant", "idle", "Empty");

    if (vals.GEMINI_API_KEY) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "gemini", geminiApiKey: vals.GEMINI_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("gemini", "ok", "✓ " + (d.model || "Connected"));
        else { setBadge("gemini", "err", "Failed"); errors.push("Gemini: " + d.reason); }
      } catch (e) { setBadge("gemini", "err", "Error"); }
    } else setBadge("gemini", "idle", "Empty");

    if (vals.DATABASE_URL) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "sql", databaseUrl: vals.DATABASE_URL } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("sql", "ok", "✓ " + (d.dialect || "Connected"));
        else { setBadge("sql", "err", "Failed"); errors.push("SQL: " + d.reason); }
      } catch (e) { setBadge("sql", "err", "Error"); }
    } else setBadge("sql", "idle", "Empty");

    if (errors.length > 0) setStatus("err", errors.join(" | "));
    else setStatus("ok", "✓ All active connections tested successfully!");
  }

  async function saveAllCredentials() {
    const vals = getCredentialsFormValues();
    const btn = document.getElementById("saveCredentialsBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    setStatus(null, "");

    await runConnectionTests();

    try {
      const res = await app.callServerTool({ name: "panel_save_all_credentials", arguments: vals });
      const data = JSON.parse(res.content[0].text);
      if (data.status === "ok") {
        state.credentials = vals;
        // Automatically transition to App Configuration tab!
        switchTopTab("config");
        return;
      } else {
        setStatus("err", data.message || "Failed to save credentials.");
      }
    } catch (err) {
      setStatus("err", "Error: " + err.message);
    }
    btn.disabled = false;
    btn.textContent = "Save & Connect";
  }

  /* ------------------- Tab 2: App Configuration ------------------- */

  function renderAppConfigTab(container) {
    const sub = state.activeSubSession;
    const selectedCount = Array.from(state.selectedRepos.values()).length;

    container.innerHTML = `
      <div class="section-intro">
        <h3>⚙️ Application Configuration</h3>
        <p>Manage multi-source context sessions, active repositories, and AI system prompt.</p>
      </div>

      <!-- Sub-Session Pills -->
      <div class="sub-pills">
        <button class="sub-pill ${sub === "github" ? "active" : ""}" id="pillGithub">
          🐙 GitHub (${selectedCount})
        </button>
        <button class="sub-pill ${sub === "prompt" ? "active" : ""}" id="pillPrompt">
          🧠 System Prompt
        </button>
        <button class="sub-pill ${sub === "notion" ? "active" : ""}" id="pillNotion">
          📝 Notion
        </button>
        <button class="sub-pill ${sub === "database" ? "active" : ""}" id="pillDatabase">
          🗄️ Database
        </button>
      </div>

      <div id="subSessionContent"></div>

      <div class="btn-row" style="justify-content:space-between; margin-top:20px;">
        <button class="primary" id="saveAppConfigBtn">💾 Save Application Configuration</button>
        <span style="font-size:12px;color:var(--muted);" id="saveTimestamp">
          ${state.updatedAt ? "Updated: " + new Date(state.updatedAt).toLocaleTimeString() : ""}
        </span>
      </div>

      <div id="statusBox" class="${state.statusType ? 'status-box ' + state.statusType : 'status-box'}">${esc(state.statusMessage)}</div>
    `;

    document.getElementById("pillGithub")?.addEventListener("click", () => switchSubSession("github"));
    document.getElementById("pillPrompt")?.addEventListener("click", () => switchSubSession("prompt"));
    document.getElementById("pillNotion")?.addEventListener("click", () => switchSubSession("notion"));
    document.getElementById("pillDatabase")?.addEventListener("click", () => switchSubSession("database"));
    document.getElementById("saveAppConfigBtn")?.addEventListener("click", saveAppConfig);

    const subContent = document.getElementById("subSessionContent");
    if (sub === "github") renderGitHubSession(subContent);
    else if (sub === "prompt") renderPromptSession(subContent);
    else if (sub === "notion") renderNotionSession(subContent);
    else if (sub === "database") renderDatabaseSession(subContent);
  }

  function switchSubSession(sub) {
    state.activeSubSession = sub;
    const subContent = document.getElementById("subSessionContent");
    if (subContent) {
      if (sub === "github") renderGitHubSession(subContent);
      else if (sub === "prompt") renderPromptSession(subContent);
      else if (sub === "notion") renderNotionSession(subContent);
      else if (sub === "database") renderDatabaseSession(subContent);
    }
    ["github", "prompt", "notion", "database"].forEach(s => {
      const el = document.getElementById("pill" + s.charAt(0).toUpperCase() + s.slice(1));
      if (el) el.className = "sub-pill " + (s === sub ? "active" : "");
    });
  }

  /* Sub-session: GitHub */
  function renderGitHubSession(container) {
    const filterText = (state.reposSearch || "").toLowerCase();
    const filteredRepos = state.repos.filter(r => {
      const name = (typeof r === "string" ? r : (r.fullName || r.full_name || r.name || "")).toLowerCase();
      const desc = (typeof r === "object" && r.description ? r.description : "").toLowerCase();
      return name.includes(filterText) || desc.includes(filterText);
    });

    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">🐙 Select Active GitHub Repositories</span>
          <span style="font-size:12px;color:var(--muted);">
            ${state.selectedRepos.size} of ${state.repos.length} selected
          </span>
        </div>

        <div class="repo-controls">
          <input type="text" class="repo-search-input" id="repoSearchInput" placeholder="🔍 Search repositories…" value="${esc(state.reposSearch)}" />
          <button class="secondary" id="selectAllReposBtn" style="font-size:12px;padding:6px 10px;">Select All</button>
          <button class="secondary" id="clearAllReposBtn" style="font-size:12px;padding:6px 10px;">Clear</button>
        </div>

        <div class="repo-list" id="repoListContainer">
          ${filteredRepos.length === 0 ? '<div class="loading">No repositories found. Ensure GitHub token is configured in Credentials tab.</div>' : ''}
          ${filteredRepos.map(r => {
            const name = typeof r === "string" ? r : (r.fullName || r.full_name || r.name || "");
            if (!name) return "";
            const isSelected = state.selectedRepos.has(name);
            const desc = state.selectedRepos.get(name) || "";
            return `
              <div class="repo-item ${isSelected ? 'selected' : ''}" data-name="${esc(name)}">
                <div class="repo-main-row" onclick="window._toggleRepo('${esc(name)}')">
                  <input type="checkbox" class="repo-checkbox" ${isSelected ? 'checked' : ''} />
                  <span class="repo-name">${esc(name)}</span>
                  ${typeof r === "object" && r.private ? '<span class="badge idle" style="font-size:10.5px;padding:1px 6px;">Private</span>' : ''}
                  ${typeof r === "object" && r.language ? `<span class="badge idle" style="font-size:10.5px;padding:1px 6px;">${esc(r.language)}</span>` : ''}
                </div>
                ${isSelected ? `
                  <div class="repo-desc-box">
                    <input type="text" placeholder="Custom context description for this repo (e.g. Next.js web client)" value="${esc(desc)}" oninput="window._updateRepoDesc('${esc(name)}', this.value)" />
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    document.getElementById("repoSearchInput")?.addEventListener("input", (e) => {
      state.reposSearch = e.target.value;
      renderGitHubSession(container);
    });

    document.getElementById("selectAllReposBtn")?.addEventListener("click", () => {
      state.repos.forEach(r => {
        const name = typeof r === "string" ? r : (r.fullName || r.full_name || r.name || "");
        if (name && !state.selectedRepos.has(name)) state.selectedRepos.set(name, "");
      });
      renderGitHubSession(container);
    });

    document.getElementById("clearAllReposBtn")?.addEventListener("click", () => {
      state.selectedRepos.clear();
      renderGitHubSession(container);
    });
  }


  window._toggleRepo = function(name) {
    if (state.selectedRepos.has(name)) {
      state.selectedRepos.delete(name);
    } else {
      state.selectedRepos.set(name, "");
    }
    const subContent = document.getElementById("subSessionContent");
    if (subContent) renderGitHubSession(subContent);
  };

  window._updateRepoDesc = function(name, desc) {
    state.selectedRepos.set(name, desc);
  };

  /* Sub-session: System Prompt */
  function renderPromptSession(container) {
    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">🧠 AI System Prompt (Markdown)</span>
          <button class="secondary" id="resetPromptBtn" style="font-size:12px;padding:4px 8px;">Reset to Default</button>
        </div>
        <p style="color:var(--muted);font-size:12.5px;margin:0 0 10px;">
          Define persistent AI behavioral guidelines, response styling, and domain rules.
        </p>
        <textarea id="systemPromptArea" placeholder="Enter Markdown system prompt…">${esc(state.systemPrompt)}</textarea>
      </div>
    `;

    document.getElementById("systemPromptArea")?.addEventListener("input", (e) => {
      state.systemPrompt = e.target.value;
    });

    document.getElementById("resetPromptBtn")?.addEventListener("click", () => {
      state.systemPrompt = state.defaultSystemPrompt;
      const area = document.getElementById("systemPromptArea");
      if (area) area.value = state.systemPrompt;
    });
  }

  /* Sub-session: Notion */
  function renderNotionSession(container) {
    container.innerHTML = `
      <div class="card" style="text-align:center;padding:32px 16px;">
        <span style="font-size:32px;">📝</span>
        <h4 style="margin:8px 0 4px;font-size:15px;">Notion Workspace Context</h4>
        <p style="color:var(--muted);font-size:12.5px;max-width:440px;margin:0 auto 16px;">
          Configure specific Notion database boards, PRDs, and task databases to synchronize into your team context.
        </p>
        <span class="badge ok">Token Configured</span>
      </div>
    `;
  }

  /* Sub-session: Database */
  function renderDatabaseSession(container) {
    container.innerHTML = `
      <div class="card" style="text-align:center;padding:32px 16px;">
        <span style="font-size:32px;">🗄️</span>
        <h4 style="margin:8px 0 4px;font-size:15px;">SQL Database Context</h4>
        <p style="color:var(--muted);font-size:12.5px;max-width:440px;margin:0 auto 16px;">
          Select active SQL schemas, tables, and views queryable by Claude.
        </p>
        <span class="badge ok">Ready for queries</span>
      </div>
    `;
  }

  async function saveAppConfig() {
    const btn = document.getElementById("saveAppConfigBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    setStatus(null, "");

    const activeRepos = Array.from(state.selectedRepos.entries()).map(([name, description]) => ({
      name,
      description: description || "",
    }));

    try {
      const res = await app.callServerTool({
        name: "config_save_app_config",
        arguments: {
          username: state.auth.username || "admin",
          activeRepos,
          systemPrompt: state.systemPrompt,
        },
      });
      const data = JSON.parse(res.content[0].text);
      if (data.status === "ok") {
        state.updatedAt = data.updatedAt || new Date().toISOString();
        setStatus("ok", "✓ Application configuration saved to Qdrant app-config collection!");
        const ts = document.getElementById("saveTimestamp");
        if (ts) ts.textContent = "Updated: " + new Date().toLocaleTimeString();
      } else {
        setStatus("err", data.message || "Failed to save configuration.");
      }
    } catch (err) {
      setStatus("err", "Error: " + err.message);
    }
    btn.disabled = false;
    btn.textContent = "💾 Save Application Configuration";
  }

  /* ------------------- Tab 3: Skills ------------------- */

  function renderSkillsTab(container) {
    container.innerHTML = `
      <div class="section-intro">
        <h3>🧠 Team Skills & Knowledge Base</h3>
        <p>Centrally manage, create, and search team skills and procedures in Qdrant vector DB.</p>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">🔍 Search Skills</span>
          <button class="primary" id="newSkillBtn" style="font-size:12px;padding:5px 12px;">+ New Skill</button>
        </div>
        <div class="field-group">
          <input type="text" id="skillSearchInput" placeholder="Semantic search skills in vector DB…" />
        </div>
        <div id="skillsListContainer" style="margin-top:12px;">
          <div class="loading">Loading team skills…</div>
        </div>
      </div>

      <div id="statusBox" class="${state.statusType ? 'status-box ' + state.statusType : 'status-box'}">${esc(state.statusMessage)}</div>
    `;

    document.getElementById("newSkillBtn")?.addEventListener("click", showNewSkillModal);
    document.getElementById("skillSearchInput")?.addEventListener("input", debounce(handleSkillSearch, 300));
    loadSkillsList();
  }

  async function loadSkillsList() {
    const listCont = document.getElementById("skillsListContainer");
    if (!listCont) return;
    try {
      const res = await app.callServerTool({ name: "skills_list", arguments: {} });
      const data = JSON.parse(res.content[0].text);
      renderSkillsItems(data.skills || []);
    } catch (err) {
      listCont.innerHTML = `<div style="color:var(--err-fg);font-size:12.5px;">Failed to load skills: ${esc(err.message)}</div>`;
    }
  }

  function renderSkillsItems(skills) {
    const listCont = document.getElementById("skillsListContainer");
    if (!listCont) return;
    if (skills.length === 0) {
      listCont.innerHTML = '<div style="color:var(--muted);font-size:12.5px;padding:8px 0;">No skills found. Click "+ New Skill" to add one.</div>';
      return;
    }
    listCont.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${skills.map(s => `
          <div class="card" style="margin-bottom:0;padding:10px 12px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <strong style="font-size:13.5px;">${esc(s.name || s.title || "Untitled Skill")}</strong>
                <p style="margin:4px 0 0;font-size:12px;color:var(--muted);">${esc(s.description || s.summary || "")}</p>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="secondary" style="font-size:11.5px;padding:3px 8px;" onclick="window._deleteSkill('${esc(s.id)}')">Delete</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function debounce(fn, delay) {
    let t;
    return function(...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), delay);
    };
  }

  async function handleSkillSearch() {
    const query = document.getElementById("skillSearchInput")?.value.trim();
    if (!query) {
      loadSkillsList();
      return;
    }
    const listCont = document.getElementById("skillsListContainer");
    if (!listCont) return;
    try {
      const res = await app.callServerTool({ name: "skills_search", arguments: { query } });
      const data = JSON.parse(res.content[0].text);
      renderSkillsItems(data.skills || []);
    } catch (err) {
      listCont.innerHTML = `<div style="color:var(--err-fg);font-size:12.5px;">Search error: ${esc(err.message)}</div>`;
    }
  }

  function showNewSkillModal() {
    const name = prompt("Enter skill name:");
    if (!name) return;
    const description = prompt("Enter skill description:");
    const content = prompt("Enter skill content/instructions:");
    if (!content) return;
    app.callServerTool({
      name: "skills_save",
      arguments: { name, description, content },
    }).then(() => loadSkillsList()).catch(e => alert(e.message));
  }

  window._deleteSkill = function(id) {
    if (!confirm("Are you sure you want to delete this skill?")) return;
    app.callServerTool({
      name: "skills_delete",
      arguments: { id },
    }).then(() => loadSkillsList()).catch(e => alert(e.message));
  };

  /* ------------------- Boot ------------------- */
  await app.connect();
  await loadInitialData();
</script>
