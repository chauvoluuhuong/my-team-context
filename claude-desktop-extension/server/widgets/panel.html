<div id="root" class="panel-app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Checking Team Context & Connections…</div>
  </div>
</div>

<style>
  :root {
    --bg: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --ok-bg: #ecfdf5;
    --ok-fg: #059669;
    --warn-bg: #fffbeb;
    --warn-fg: #d97706;
    --err-bg: #fef2f2;
    --err-fg: #dc2626;
    --code-bg: #f8fafc;
    --card-bg: #ffffff;
    --card-hover: #f1f5f9;
    --card-selected: #f0fdf4;
    --card-selected-border: #86efac;
    --border: #cbd5e1;
    --purple-bg: #f3e8ff;
    --purple-fg: #7e22ce;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f19;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --line: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #172554;
      --ok-bg: #064e3b;
      --ok-fg: #34d399;
      --warn-bg: #78350f;
      --warn-fg: #fbbf24;
      --err-bg: #7f1d1d;
      --err-fg: #f87171;
      --code-bg: #111827;
      --card-bg: #111827;
      --card-hover: #1e293b;
      --card-selected: #062e24;
      --card-selected-border: #059669;
      --border: #334155;
      --purple-bg: #3b0764;
      --purple-fg: #d8b4fe;
    }

  * {
    box-sizing: border-box;
  }

  .panel-app {
    background: var(--bg);
    color: var(--fg);
    font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    border: 1px solid var(--line);

    padding: 20px;
    max-width: 720px;

    display: flex;
    flex-direction: column;

  .header {

    padding-bottom: 12px;

  h2 {

  .header-actions {

  .user-badge {

  .btn-signout {

  .btn-header-secondary {

  /* Form & Cards */

<script>
  /*__EXT_APPS_BUNDLE__*/
</script>

<script type="module">
  const { App } = globalThis.ExtApps || {};
  const app = new App({ name: "TeamContextApp", version: "0.1.0" }, {}, { autoResize: true });

  const state = {
    viewState: "loading", // "loading" | "error_countdown" | "qdrant_config" | "user_selection" | "main"
    activeTopTab: "credentials", // "credentials" | "config"
    activeSubSession: "github",  // "github" | "prompt" | "notion" | "database"
    currentUser: { name: "", role: "" },
    users: [],
    qdrant: { configured: false, connected: false, endpoint: "", error: null },
    credentials: {},
    teamStatus: {},
    repos: [],
    reposSearch: "",
    selectedRepos: new Map(), // name -> description
    notionPages: [],
    notionPagesSearch: "",
    selectedNotionPages: new Map(), // id -> { id, title, description, url, icon, lastEditedTime }
    isNotionConnected: false,
    notionBotName: null,
    systemPrompt: "",
    defaultSystemPrompt: "",
    createdAt: "",
    updatedAt: "",
    statusType: null,
    statusMessage: "",
    // Countdown state
    countdownSeconds: 10,
    countdownTimer: null,
    errorMessage: "",
    isSaving: false,
  };

  const root = document.getElementById("root");

  function esc(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function setStatus(type, msg) {
    state.statusType = type;
    state.statusMessage = msg;
    const box = document.getElementById("statusBox");
    if (box) {
      box.className = "status-box " + (type || "");
      box.textContent = msg || "";
    }
  }

  function setBadge(id, kind, text) {
    const el = document.getElementById("badge-" + id);
    if (el) {
      el.className = "badge " + kind;
      el.textContent = text;
    }
  }

  /* ------------------- Initial Load & Setup Check ------------------- */

  async function checkSetupAndLoad() {
    clearCountdown();
    state.viewState = "loading";
    render();

    try {
      // 1. Centralized setup verification
      const setupRes = await app.callServerTool({
        name: "panel_check_setup",
        arguments: {},
      });
      const setup = JSON.parse(setupRes.content[0].text);

      state.users = setup.users || [];
      state.qdrant = setup.qdrant || {};
      state.currentUser = setup.currentUser || { name: "", role: "" };

      // Also load existing env configuration for prefilling
      try {
        const configRes = await app.callServerTool({ name: "panel_load_config", arguments: {} });
        const cfg = JSON.parse(configRes.content[0].text);
        state.credentials = cfg.config || {};
      } catch {}

      // Check if there is a connection error with Qdrant when Qdrant is already configured
      if (!setup.qdrant?.connected && setup.qdrant?.configured) {
        state.errorMessage = setup.error || setup.qdrant?.error || "Unable to establish connection to Qdrant cluster.";
        startCountdown();
        return;
      }

      // Check setup progression steps
      if (setup.step === "qdrant_config" || !setup.qdrant?.connected) {
        state.viewState = "qdrant_config";
        render();
        return;
      }

      if (setup.step === "user_selection" || !setup.currentUser?.name) {
        state.viewState = "user_selection";
        render();
        return;
      }

      // Setup is completed! Load application configuration state
      await loadAppConfigData();
      state.viewState = "main";
      render();
    } catch (err) {
      console.error("Setup check error:", err);
      state.errorMessage = err.message || "Failed to initialize Team Context.";
      startCountdown();
    }
  }

  async function loadAppConfigData() {
    try {
      const appStateRes = await app.callServerTool({ name: "config_get_app_state", arguments: {} });
      const appData = JSON.parse(appStateRes.content[0].text);

      state.repos = appData.repos || [];
      state.defaultSystemPrompt = appData.defaultSystemPrompt || "";
      state.isNotionConnected = Boolean(appData.isNotionConnected);
      state.notionBotName = appData.notionBotName || null;
      state.notionPages = appData.notionPages || [];

      const appConfig = appData.appConfig || {};
      state.systemPrompt = appConfig.systemPrompt || appData.defaultSystemPrompt || "";
      state.createdAt = appConfig.createdAt || "";
      state.updatedAt = appConfig.updatedAt || "";

      state.selectedRepos.clear();
      (appConfig.activeRepos || []).forEach(r => {
        if (r && r.name) state.selectedRepos.set(r.name, r.description || "");
      });

      state.selectedNotionPages.clear();
      (appConfig.activeNotionPages || []).forEach(n => {
        if (n && n.id) {
          state.selectedNotionPages.set(n.id, {
            id: n.id,
            title: n.title || "",
            url: n.url || "",
            description: n.description || "",
            lastEditedTime: n.lastEditedTime || "",
            icon: n.icon || "📄",
          });
        }
      });
    } catch (err) {
      console.error("Failed to load app config data:", err);
    }
  }

  /* ------------------- Countdown Handler ------------------- */

  function startCountdown() {
    clearCountdown();
    state.countdownSeconds = 10;
    state.viewState = "error_countdown";
    render();

    state.countdownTimer = setInterval(() => {
      state.countdownSeconds -= 1;
      const secEl = document.getElementById("countdownSeconds");
      const fillEl = document.getElementById("countdownProgressFill");
      if (secEl) secEl.textContent = state.countdownSeconds + "s";
      if (fillEl) fillEl.style.width = ((state.countdownSeconds / 10) * 100) + "%";

      if (state.countdownSeconds <= 0) {
        clearCountdown();
        state.viewState = "qdrant_config";
        render();
      }
    }, 1000);
  }

  function clearCountdown() {
    if (state.countdownTimer) {
      clearInterval(state.countdownTimer);
      state.countdownTimer = null;
    }
  }

  /* ------------------- View Router ------------------- */

  function render() {
    if (state.viewState === "loading") {
      renderLoading();
      return;
    }

    if (state.viewState === "error_countdown") {
      renderErrorCountdown();
      return;
    }

    if (state.viewState === "qdrant_config") {
      renderQdrantConfigStep();
      return;
    }

    if (state.viewState === "user_selection") {
      renderUserSelectionStep();
      return;
    }

    if (state.viewState === "main") {
      renderMainDashboard();
      return;
    }
  }

  async function handleSaveQdrantConfig() {
    const url = document.getElementById("setupQdrantUrl")?.value.trim();
    const apiKey = document.getElementById("setupQdrantKey")?.value.trim();

    if (!url) {
      setStatus("err", "Please enter a Qdrant cluster endpoint URL.");
      return;
    }

    state.isSaving = true;
    setStatus(null, "");
    render();

    try {
      const res = await app.callServerTool({
        name: "panel_save_qdrant_config",
        arguments: { qdrantUrl: url, qdrantApiKey: apiKey || undefined },
      });
      const data = JSON.parse(res.content[0].text);

      if (data.success) {
        state.credentials.QDRANT_URL = data.endpoint || url;
        state.credentials.QDRANT_API_KEY = apiKey;
        state.qdrant.connected = true;
        state.qdrant.endpoint = data.endpoint || url;
        state.users = data.users || [];
        state.isSaving = false;
        state.viewState = "user_selection";
        render();
      } else {
        state.isSaving = false;
        render();
        setStatus("err", data.reason || "Failed to connect to Qdrant.");
      }
    } catch (err) {
      state.isSaving = false;
      render();
      setStatus("err", "Connection error: " + err.message);
    }
  }

  async function runConnectionTests() {
    const vals = getCredentialsFormValues();
    setStatus(null, "");
    setBadge("github", "idle", "Testing…");
    setBadge("notion", "idle", "Testing…");
    setBadge("qdrant", "idle", "Testing…");
    setBadge("gemini", "idle", "Testing…");
    setBadge("sql", "idle", "Testing…");

    let errors = [];

    if (vals.GITHUB_TOKEN) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "github", githubToken: vals.GITHUB_TOKEN } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("github", "ok", "✓ " + (d.login || "Connected"));
        else { setBadge("github", "err", "Failed"); errors.push("GitHub: " + d.reason); }
      } catch (e) { setBadge("github", "err", "Error"); }
    } else setBadge("github", "idle", "Empty");

    if (vals.NOTION_API_KEY) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "notion", notionApiKey: vals.NOTION_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("notion", "ok", "✓ " + (d.botName || "Connected"));
        else { setBadge("notion", "err", "Failed"); errors.push("Notion: " + d.reason); }
      } catch (e) { setBadge("notion", "err", "Error"); }
    } else setBadge("notion", "idle", "Empty");

    if (vals.QDRANT_URL) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "qdrant", qdrantUrl: vals.QDRANT_URL, qdrantApiKey: vals.QDRANT_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("qdrant", "ok", "✓ Connected (" + (d.collectionsCount || 0) + " col)");
        else { setBadge("qdrant", "err", "Failed"); errors.push("Qdrant: " + d.reason); }
      } catch (e) { setBadge("qdrant", "err", "Error"); }
    } else setBadge("qdrant", "idle", "Empty");

    if (vals.GEMINI_API_KEY) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "gemini", geminiApiKey: vals.GEMINI_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("gemini", "ok", "✓ " + (d.model || "Connected"));
        else { setBadge("gemini", "err", "Failed"); errors.push("Gemini: " + d.reason); }
      } catch (e) { setBadge("gemini", "err", "Error"); }
    } else setBadge("gemini", "idle", "Empty");

    if (vals.DATABASE_URL) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "sql", databaseUrl: vals.DATABASE_URL } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok) setBadge("sql", "ok", "✓ " + (d.dialect || "Connected"));
        else { setBadge("sql", "err", "Failed"); errors.push("SQL: " + d.reason); }
      } catch (e) { setBadge("sql", "err", "Error"); }
    } else setBadge("sql", "idle", "Empty");

    if (errors.length > 0) setStatus("err", errors.join(" | "));
    else setStatus("ok", "✓ All active connections tested successfully!");
  }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span> Saving…';
    setStatus(null, "");

    await runConnectionTests();

    try {
      const res = await app.callServerTool({ name: "panel_save_all_credentials", arguments: vals });
      const data = JSON.parse(res.content[0].text);
      if (data.status === "ok") {
        state.credentials = vals;
        switchTopTab("config");
        return;
      } else {
        setStatus("err", data.message || "Failed to save credentials.");
      }
    } catch (err) {
      setStatus("err", "Error: " + err.message);
    }
    btn.disabled = false;
    btn.innerHTML = "💾 Save & Connect";
  }

  /* ------------------- Tab 2: App Configuration ------------------- */

  function renderAppConfigTab(container) {
    const sub = state.activeSubSession;
    const selectedRepoCount = Array.from(state.selectedRepos.values()).length;
    const selectedNotionCount = Array.from(state.selectedNotionPages.values()).length;

    container.innerHTML = `
      <div class="section-intro">
        <h3>⚙️ Application Configuration</h3>
        <p>Manage multi-source context sessions, active repositories, Notion pages, and AI system prompt.</p>
      </div>

      <!-- Sub-Session Pills -->
      <div class="sub-pills">
        <button class="sub-pill ${sub === "github" ? "active" : ""}" id="pillGithub">

        </button>
        <button class="sub-pill ${sub === "notion" ? "active" : ""}" id="pillNotion">
          📝 Notion (${selectedNotionCount})
        </button>
        <button class="sub-pill ${sub === "prompt" ? "active" : ""}" id="pillPrompt">
          🧠 System Prompt
        </button>
        <button class="sub-pill ${sub === "database" ? "active" : ""}" id="pillDatabase">
          🗄️ Database
        </button>
      </div>

      <div id="subSessionContent"></div>

      <div class="btn-row" style="justify-content:space-between; margin-top:20px;">
        <button class="primary" id="saveAppConfigBtn">💾 Save Application Configuration</button>
        <span style="font-size:12px;color:var(--muted);" id="saveTimestamp">
          ${state.updatedAt ? "Updated: " + new Date(state.updatedAt).toLocaleTimeString() : ""}
        </span>
      </div>

      <div id="statusBox" class="${state.statusType ? 'status-box ' + state.statusType : 'status-box'}">${esc(state.statusMessage)}</div>

    document.getElementById("pillNotion")?.addEventListener("click", () => switchSubSession("notion"));
    document.getElementById("pillPrompt")?.addEventListener("click", () => switchSubSession("prompt"));
    document.getElementById("pillDatabase")?.addEventListener("click", () => switchSubSession("database"));
    document.getElementById("saveAppConfigBtn")?.addEventListener("click", saveAppConfig);

    const subContent = document.getElementById("subSessionContent");
    if (sub === "github") renderGitHubSession(subContent);
    else if (sub === "notion") renderNotionSession(subContent);
    else if (sub === "prompt") renderPromptSession(subContent);
    else if (sub === "database") renderDatabaseSession(subContent);
  }

  function switchSubSession(sub) {
    state.activeSubSession = sub;
    const subContent = document.getElementById("subSessionContent");
    if (subContent) {
      if (sub === "github") renderGitHubSession(subContent);
      else if (sub === "notion") renderNotionSession(subContent);
      else if (sub === "prompt") renderPromptSession(subContent);
      else if (sub === "database") renderDatabaseSession(subContent);
    }
    ["github", "notion", "prompt", "database"].forEach(s => {
      const el = document.getElementById("pill" + s.charAt(0).toUpperCase() + s.slice(1));
      if (el) el.className = "sub-pill " + (s === sub ? "active" : "");
    });
  }

  /* Sub-session: GitHub */
  function renderGitHubSession(container) {
    const filterText = (state.reposSearch || "").toLowerCase();
    const filteredRepos = state.repos.filter(r => {
      const name = (typeof r === "string" ? r : (r.fullName || r.full_name || r.name || "")).toLowerCase();
      const desc = (typeof r === "object" && r.description ? r.description : "").toLowerCase();
      return name.includes(filterText) || desc.includes(filterText);
    });

    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">🐙 Select Active GitHub Repositories</span>
          <span style="font-size:12px;color:var(--muted);">
            ${state.selectedRepos.size} of ${state.repos.length} selected
          </span>
        </div>

        <div class="repo-controls">
          <input type="text" class="repo-search-input" id="repoSearchInput" placeholder="🔍 Search repositories…" value="${esc(state.reposSearch)}" />
          <button class="secondary" id="selectAllReposBtn" style="font-size:12px;padding:6px 10px;">Select All</button>
          <button class="secondary" id="clearAllReposBtn" style="font-size:12px;padding:6px 10px;">Clear</button>
        </div>

        <div class="repo-list" id="repoListContainer">
          ${filteredRepos.length === 0 ? '<div class="loading-screen" style="padding:20px 0;"><p>No repositories found. Ensure GitHub token is configured in Credentials tab.</p></div>' : ''}
          ${filteredRepos.map(r => {
            const name = typeof r === "string" ? r : (r.fullName || r.full_name || r.name || "");
            if (!name) return "";
            const isSelected = state.selectedRepos.has(name);
            const desc = state.selectedRepos.get(name) || "";
            const safeId = name.replace(/[^a-zA-Z0-9_-]/g, '_');
            return `
              <div class="repo-item ${isSelected ? 'selected' : ''}" data-name="${esc(name)}">
                <div class="repo-main-row" onclick="window._toggleRepo('${esc(name)}')">
                  <input type="checkbox" class="repo-checkbox" ${isSelected ? 'checked' : ''} />
                  <span class="repo-name">${esc(name)}</span>
                  ${typeof r === "object" && r.private ? '<span class="badge idle" style="font-size:10.5px;padding:1px 6px;">Private</span>' : ''}
                  ${typeof r === "object" && r.language ? `<span class="badge idle" style="font-size:10.5px;padding:1px 6px;">${esc(r.language)}</span>` : ''}
                </div>
                ${isSelected ? `
                  <div class="repo-desc-box">
                    <input type="text" placeholder="Custom context description for this repo (e.g. Next.js web client)" value="${esc(desc)}" oninput="window._updateRepoDesc('${esc(name)}', this.value)" />
                    
                    <div class="md-sync-section" style="margin-top:10px;padding:10px 12px;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;">📄 Markdown Skills Sync</span>
                        <button class="secondary" style="font-size:11.5px;padding:3px 9px;" onclick="window._scanMdFiles('${esc(name)}')">
                          🔍 Find .md Files
                        </button>
                      </div>
                      <div id="md-list-${safeId}" style="margin-top:4px;"></div>
                    </div>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    document.getElementById("repoSearchInput")?.addEventListener("input", (e) => {
      state.reposSearch = e.target.value;
      renderGitHubSession(container);
    });

    document.getElementById("selectAllReposBtn")?.addEventListener("click", () => {
      state.repos.forEach(r => {
        const name = typeof r === "string" ? r : (r.fullName || r.full_name || r.name || "");
        if (name && !state.selectedRepos.has(name)) state.selectedRepos.set(name, "");

    document.getElementById("clearAllReposBtn")?.addEventListener("click", () => {
      state.selectedRepos.clear();
      renderGitHubSession(container);

  /* ------------------- Centralized Skill Name & Modal Flow ------------------- */

  function formatSkillName(repo, filePath, title) {
    const cleanRepo = (repo || "").trim();
    const cleanPath = (filePath || "").trim().replace(/^\/+/, "");
    const baseName = title && title.trim()
      ? title.trim()
      : (cleanPath.split("/").pop().replace(/\.[^/.]+$/, ""));
    return `[github-repo: ${cleanRepo}, path: ${cleanPath}] ${baseName}`;
  }

  window._mdFilesCache = window._mdFilesCache || {};
  window._mdSelectedCache = window._mdSelectedCache || {};

  window._scanMdFiles = async function(repo) {
    const safeId = repo.replace(/[^a-zA-Z0-9_-]/g, '_');
    const cont = document.getElementById("md-list-" + safeId);
    if (!cont) return;
    cont.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:6px;"><span class="spinner-sm spinner-dark"></span> Scanning repository for .md files…</div>';

    try {
      const res = await app.callServerTool({ name: "config_list_repo_md_files", arguments: { repo } });
      const data = JSON.parse(res.content[0].text);
      const files = data.mdFiles || [];
      window._mdFilesCache[repo] = files;
      window._mdSelectedCache[repo] = new Set(files.map(f => f.path));

      renderMdFileList(repo, safeId);
    } catch (err) {
      cont.innerHTML = `<div style="font-size:12px;color:var(--err-fg);padding:4px 0;">Failed to scan: ${esc(err.message)}</div>`;
    }
  };

  function renderMdFileList(repo, safeId) {
    const cont = document.getElementById("md-list-" + safeId);
    if (!cont) return;
    const files = window._mdFilesCache[repo] || [];
    const selected = window._mdSelectedCache[repo] || new Set();

    if (files.length === 0) {
      cont.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:4px 0;">No .md files found in this repository.</div>';
      return;
    }

    cont.innerHTML = `
      <div style="margin-top:6px;border-top:1px dashed var(--line);padding-top:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:11.5px;color:var(--muted);font-weight:600;">Found ${files.length} .md files (${selected.size} selected)</span>
          <div style="display:flex;gap:4px;">
            <button class="secondary" style="font-size:10.5px;padding:2px 6px;" onclick="window._toggleAllMd('${esc(repo)}', true)">All</button>
            <button class="secondary" style="font-size:10.5px;padding:2px 6px;" onclick="window._toggleAllMd('${esc(repo)}', false)">None</button>
          </div>
        </div>
        <div style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:8px;padding-right:4px;">
          ${files.map(f => {
            const isChecked = selected.has(f.path);
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 8px;border-radius:6px;background:var(--card-bg);border:1px solid var(--border);">
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;flex:1;min-width:0;">
                  <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="window._toggleMdItem('${esc(repo)}', '${esc(f.path)}', this.checked)" />
                  <span style="font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all;">${esc(f.path)}</span>
                  ${f.size ? `<span style="font-size:10px;color:var(--muted);">(${Math.round(f.size / 1024)} KB)</span>` : ''}
                </label>
                <div style="display:flex;align-items:center;gap:6px;">
                  ${f.isSynced ? '<span class="badge ok" style="font-size:10px;padding:1px 6px;">✓ Synced</span>' : '<span class="badge idle" style="font-size:10px;padding:1px 6px;">New</span>'}
                  <button class="secondary" style="font-size:11px;padding:2px 7px;" onclick="window._openMdModal('${esc(repo)}', '${esc(f.path)}')">
                    ⚡ Sync / Name
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="primary" style="font-size:11.5px;padding:4px 10px;" onclick="window._syncMdFiles('${esc(repo)}')">
            ⚡ Sync (${selected.size}) Selected Skills
          </button>
          <span id="md-sync-status-${safeId}" style="font-size:11.5px;"></span>
        </div>
      </div>
    `;
  }

  window._toggleAllMd = function(repo, selectAll) {
    const files = window._mdFilesCache[repo] || [];
    if (selectAll) {
      window._mdSelectedCache[repo] = new Set(files.map(f => f.path));
    } else {
      window._mdSelectedCache[repo] = new Set();
    }
    const safeId = repo.replace(/[^a-zA-Z0-9_-]/g, '_');
    renderMdFileList(repo, safeId);
  };

  window._toggleMdItem = function(repo, filePath, isChecked) {
    const selected = window._mdSelectedCache[repo] || new Set();
    if (isChecked) selected.add(filePath);
    else selected.delete(filePath);
    window._mdSelectedCache[repo] = selected;
    const safeId = repo.replace(/[^a-zA-Z0-9_-]/g, '_');
    renderMdFileList(repo, safeId);
  };

  /* ------------------- Interactive Sync Modal ------------------- */

  window._currentModalFileContent = "";

  window._openMdModal = async function(repo, filePath) {
    const modalContainer = document.getElementById("modalContainer");
    if (!modalContainer) return;

    modalContainer.innerHTML = `
      <div class="modal-overlay" id="mdModalOverlay" onclick="if(event.target === this) window._closeMdModal()">
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 class="modal-title">📄 Configure & Sync Skill</h3>
            <button class="btn-close" onclick="window._closeMdModal()">✕</button>

          <div class="loading-screen" style="padding:20px 0;">
            <div class="spinner"></div>

          </div>
        </div>
      </div>
    `;

    try {
      const res = await app.callServerTool({
        name: "config_preview_repo_md_file",

      });
      const data = JSON.parse(res.content[0].text);

      const modalDialog = document.querySelector(".modal-dialog");
      if (!modalDialog) return;

      window._currentModalFileContent = data.content || "";
      const prefix = data.prefix || `[${repo}:${filePath}]`;
      const suggestedName = data.suggestedName || formatSkillName(repo, filePath, data.defaultTitle);
      const suggestedDesc = data.suggestedDescription || `Imported from ${repo}/${filePath}`;
      const isExisting = Boolean(data.exists);
      const linesCount = (data.content || "").split("\n").length;
      const charCount = (data.content || "").length;

      modalDialog.innerHTML = `
        <div class="modal-header">
          <div>
            <h3 class="modal-title">📄 Import Skill from Markdown</h3>
            <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">
              📍 Location: <strong style="color:var(--fg);">${esc(repo)}</strong> → <span style="font-family:ui-monospace,monospace;">${esc(filePath)}</span>
            </div>
          </div>
          <button class="btn-close" onclick="window._closeMdModal()">✕</button>
        </div>

        ${isExisting ? `
          <div style="padding:8px 12px;background:var(--card-selected);border:1px solid var(--accent);border-radius:6px;font-size:12px;margin-bottom:12px;color:var(--fg);">
            ℹ️ <strong>Already imported in Qdrant</strong>. Syncing will update this skill in-place with your new name, description, and fresh vector embedding.
          </div>
        ` : ''}

        <div class="field-group" style="margin-bottom:12px;">
          <label style="font-size:12px;font-weight:600;display:flex;justify-content:space-between;">
            <span>Skill Name:</span>
            <span style="font-size:11px;color:var(--muted);font-weight:normal;">Suggested with origin prefix</span>
          </label>
          <input type="text" id="modalSkillName" value="${esc(suggestedName)}" placeholder="e.g. ${esc(prefix)} Overview" />
          <div style="font-size:11px;color:var(--muted);margin-top:3px;">
            Prefix <code style="background:var(--code-bg);padding:1px 4px;border-radius:3px;">${esc(prefix)}</code> identifies origin repo & file path.
          </div>
        </div>

        <div class="field-group" style="margin-bottom:12px;">
          <label style="font-size:12px;font-weight:600;">Skill Description / Summary:</label>
          <input type="text" id="modalSkillDesc" value="${esc(suggestedDesc)}" placeholder="Brief summary of this skill…" />
        </div>

        <div class="field-group" style="margin-bottom:14px;">
          <label style="font-size:12px;font-weight:600;display:flex;justify-content:space-between;">
            <span>Markdown Content Preview:</span>
            <span style="font-size:11px;color:var(--muted);">${linesCount} lines · ${charCount} chars</span>
          </label>
          <div class="preview-box" style="max-height:160px;">${esc(data.content || "(Empty file)")}</div>
        </div>

        <div id="modalStatusBox" style="font-size:12px;margin-bottom:12px;display:none;"></div>

        <div class="btn-row" style="justify-content:flex-end;gap:8px;">
          <button class="secondary" onclick="window._closeMdModal()">Cancel</button>
          <button class="primary" id="modalSyncBtn" onclick="window._saveSingleMdSkill('${esc(repo)}', '${esc(filePath)}')">
            ⚡ Sync Skill
          </button>
        </div>
      `;
    } catch (err) {
      const modalDialog = document.querySelector(".modal-dialog");
      if (modalDialog) {
        modalDialog.innerHTML = `
          <div class="modal-header">
            <h3 class="modal-title">Error</h3>
            <button class="btn-close" onclick="window._closeMdModal()">✕</button>
          </div>
          <div style="color:var(--err-fg);padding:10px 0;font-size:12.5px;">Failed to load preview: ${esc(err.message)}</div>
        `;
      }
    }
  };

  window._closeMdModal = function() {
    const modalContainer = document.getElementById("modalContainer");
    if (modalContainer) modalContainer.innerHTML = "";
    window._currentModalFileContent = "";
  };

  window._saveSingleMdSkill = async function(repo, filePath) {
    const nameInput = document.getElementById("modalSkillName");
    const descInput = document.getElementById("modalSkillDesc");
    const syncBtn = document.getElementById("modalSyncBtn");
    const statusBox = document.getElementById("modalStatusBox");

    const customName = nameInput ? nameInput.value.trim() : "";
    const customDesc = descInput ? descInput.value.trim() : "";

    if (!customName) {
      if (statusBox) {
        statusBox.style.display = "block";
        statusBox.style.color = "var(--err-fg)";
        statusBox.textContent = "Skill name cannot be empty.";
      }
      return;
    }

    if (syncBtn) {
      syncBtn.disabled = true;
      syncBtn.innerHTML = '<span class="spinner-sm"></span> Syncing & Embedding…';
    }

    try {
      const res = await app.callServerTool({
        name: "config_sync_repo_md_files",
        arguments: {
          repo,
          items: [
            {
              filePath,
              name: customName,
              description: customDesc,
              content: window._currentModalFileContent || undefined,
            },
          ],
        },
      });

      const data = JSON.parse(res.content[0].text);
      if (data.status === "ok" && data.synced > 0) {
        const files = window._mdFilesCache[repo] || [];
        const fileObj = files.find(f => f.path === filePath);
        if (fileObj) fileObj.isSynced = true;

        const safeId = repo.replace(/[^a-zA-Z0-9_-]/g, '_');
        renderMdFileList(repo, safeId);

        if (statusBox) {
          statusBox.style.display = "block";
          statusBox.style.color = "var(--ok-fg)";
          statusBox.textContent = "✓ Skill successfully synced to Qdrant!";
        }

        setTimeout(() => {
          window._closeMdModal();
        }, 700);
      } else {
        throw new Error(data.message || "Failed to sync skill.");
      }
    } catch (err) {
      if (statusBox) {
        statusBox.style.display = "block";
        statusBox.style.color = "var(--err-fg)";
        statusBox.textContent = "Error: " + err.message;
      }
      if (syncBtn) {
        syncBtn.disabled = false;
        syncBtn.textContent = "⚡ Sync Skill";
      }
    }
  };

  window._syncMdFiles = async function(repo) {
    const safeId = repo.replace(/[^a-zA-Z0-9_-]/g, '_');
    const statusEl = document.getElementById("md-sync-status-" + safeId);
    const selected = Array.from(window._mdSelectedCache[repo] || []);

    if (selected.length === 0) {
      if (statusEl) {
        statusEl.style.color = "var(--err-fg)";
        statusEl.textContent = "Please select at least 1 .md file.";
      }
      return;
    }

    if (statusEl) {
      statusEl.style.color = "var(--muted)";
      statusEl.innerHTML = `<span class="spinner-sm spinner-dark"></span> Syncing ${selected.length} skills to Qdrant…`;
    }

    try {
      const res = await app.callServerTool({
        name: "config_sync_repo_md_files",
        arguments: { repo, filePaths: selected },
      });
      const data = JSON.parse(res.content[0].text);
      if (data.status === "ok") {
        const files = window._mdFilesCache[repo] || [];
        files.forEach(f => {
          if (selected.includes(f.path)) f.isSynced = true;
        });
        renderMdFileList(repo, safeId);

        const statusElAfter = document.getElementById("md-sync-status-" + safeId);
        if (statusElAfter) {
          statusElAfter.style.color = "var(--ok-fg)";
          statusElAfter.textContent = `✓ ${data.synced} of ${data.total} skills synced to Qdrant!`;
        }
      } else {
        if (statusEl) {
          statusEl.style.color = "var(--err-fg)";
          statusEl.textContent = data.message || "Sync failed.";
        }
      }
    } catch (err) {
      if (statusEl) {
        statusEl.style.color = "var(--err-fg)";
        statusEl.textContent = "Error: " + err.message;
      }
    }
  };

  window._toggleRepo = function (name) {
    if (state.selectedRepos.has(name)) {
      state.selectedRepos.delete(name);
    } else {
      state.selectedRepos.set(name, "");
    }
    const subContent = document.getElementById("subSessionContent");
    if (subContent) renderGitHubSession(subContent);
  };

  window._updateRepoDesc = function (name, desc) {
    state.selectedRepos.set(name, desc);
  };

  /* Sub-session: System Prompt */
  function renderPromptSession(container) {
    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">🧠 AI System Prompt (Markdown)</span>
          <button class="secondary" id="resetPromptBtn" style="font-size:12px;padding:4px 8px;">Reset to Default</button>
        </div>
        <p style="color:var(--muted);font-size:12.5px;margin:0 0 10px;">
          Define persistent AI behavioral guidelines, response styling, and domain rules.
        </p>
        <textarea id="systemPromptArea" placeholder="Enter Markdown system prompt…">${esc(state.systemPrompt)}</textarea>
      </div>
    `;

    document.getElementById("systemPromptArea")?.addEventListener("input", (e) => {
      state.systemPrompt = e.target.value;
    });

    document.getElementById("resetPromptBtn")?.addEventListener("click", () => {
      state.systemPrompt = state.defaultSystemPrompt;
      const area = document.getElementById("systemPromptArea");
      if (area) area.value = state.systemPrompt;
    });
  }

  /* Sub-session: Notion */
  function renderNotionSession(container) {
    if (!state.isNotionConnected && state.notionPages.length === 0) {
      container.innerHTML = `
        <div class="card" style="text-align:center;padding:32px 16px;">
          <span style="font-size:32px;">📝</span>
          <h4 style="margin:8px 0 4px;font-size:15px;">Notion Workspace Not Connected</h4>
          <p style="color:var(--muted);font-size:12.5px;max-width:440px;margin:0 auto 16px;">
            Configure your Notion Internal Integration Token in the Credentials tab to load and select active Notion pages.
          </p>
          <button class="primary" onclick="window._goToCredentialsTab()">⚡ Go to Credentials Tab</button>
        </div>
      `;
      return;
    }

    const filterText = (state.notionPagesSearch || "").toLowerCase();
    const filteredPages = state.notionPages.filter(p => {
      const title = (p.title || "").toLowerCase();
      const sel = state.selectedNotionPages.get(p.id);
      const desc = sel ? (sel.description || "").toLowerCase() : "";
      return title.includes(filterText) || desc.includes(filterText);
    });

    container.innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">📝 Select Active Notion Pages</span>
          <span style="font-size:12px;color:var(--muted);">
            ${state.selectedNotionPages.size} of ${state.notionPages.length} selected
          </span>
        </div>

        <div class="repo-controls">
          <input type="text" class="repo-search-input" id="notionSearchInput" placeholder="🔍 Search Notion pages…" value="${esc(state.notionPagesSearch)}" />
          <button class="secondary" id="selectAllNotionBtn" style="font-size:12px;padding:6px 10px;">Select All</button>
          <button class="secondary" id="clearAllNotionBtn" style="font-size:12px;padding:6px 10px;">Clear</button>
          <button class="secondary" id="refreshNotionBtn" style="font-size:12px;padding:6px 10px;">🔄 Refresh</button>
        </div>

        <div class="repo-list" id="notionListContainer">
          ${filteredPages.length === 0 ? '<div class="loading-screen" style="padding:20px 0;"><p>No Notion pages found. Ensure Notion integration token is configured in Credentials tab.</p></div>' : ''}
          ${filteredPages.map(p => {
            const isSelected = state.selectedNotionPages.has(p.id);
            const selItem = state.selectedNotionPages.get(p.id);
            const desc = selItem ? (selItem.description || "") : "";
            const lastEdited = p.lastEditedTime ? new Date(p.lastEditedTime).toLocaleDateString() : "";
            return `
              <div class="repo-item ${isSelected ? 'selected' : ''}" data-id="${esc(p.id)}">
                <div class="repo-main-row" onclick="window._toggleNotionPage('${esc(p.id)}')">
                  <input type="checkbox" class="repo-checkbox" ${isSelected ? 'checked' : ''} />
                  <span style="font-size:15px;line-height:1;">${esc(p.icon || '📄')}</span>
                  <span class="repo-name">${esc(p.title || 'Untitled Page')}</span>
                  ${lastEdited ? `<span class="badge idle" style="font-size:10.5px;padding:1px 6px;">${esc(lastEdited)}</span>` : ''}
                  ${p.url ? `<a href="${esc(p.url)}" target="_blank" onclick="event.stopPropagation()" style="font-size:12px;color:var(--accent);text-decoration:none;margin-left:4px;" title="Open in Notion">↗</a>` : ''}
                </div>
                ${isSelected ? `
                  <div class="repo-desc-box">
                    <input type="text" placeholder="Custom context description for this page (e.g. Product Requirements Document)" value="${esc(desc)}" oninput="window._updateNotionDesc('${esc(p.id)}', this.value)" />
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    document.getElementById("notionSearchInput")?.addEventListener("input", (e) => {
      state.notionPagesSearch = e.target.value;
      renderNotionSession(container);
    });

    document.getElementById("selectAllNotionBtn")?.addEventListener("click", () => {
      state.notionPages.forEach(p => {
        if (p && p.id && !state.selectedNotionPages.has(p.id)) {
          state.selectedNotionPages.set(p.id, {
            id: p.id,
            title: p.title || "",
            url: p.url || "",
            description: "",
            lastEditedTime: p.lastEditedTime || "",
            icon: p.icon || "📄",
          });
        }
      });
      renderNotionSession(container);
    });

    document.getElementById("clearAllNotionBtn")?.addEventListener("click", () => {
      state.selectedNotionPages.clear();
      renderNotionSession(container);
    });

    document.getElementById("refreshNotionBtn")?.addEventListener("click", () => {
      window._refreshNotionPages();
    });
  }

  window._goToCredentialsTab = function() {
    switchTopTab("credentials");
  };

  window._toggleNotionPage = function(pageId) {
    if (state.selectedNotionPages.has(pageId)) {
      state.selectedNotionPages.delete(pageId);
    } else {
      const pageObj = state.notionPages.find(p => p.id === pageId);
      if (pageObj) {
        state.selectedNotionPages.set(pageId, {
          id: pageObj.id,
          title: pageObj.title || "",
          url: pageObj.url || "",
          description: "",
          lastEditedTime: pageObj.lastEditedTime || "",
          icon: pageObj.icon || "📄",
        });
      }
    }
    const subContent = document.getElementById("subSessionContent");
    if (subContent) renderNotionSession(subContent);
  };

  window._updateNotionDesc = function(pageId, desc) {
    const item = state.selectedNotionPages.get(pageId);
    if (item) {
      item.description = desc;
      state.selectedNotionPages.set(pageId, item);
    }
  };

  window._refreshNotionPages = async function() {
    const refreshBtn = document.getElementById("refreshNotionBtn");
    if (refreshBtn) {
      refreshBtn.disabled = true;
      refreshBtn.innerHTML = '<span class="spinner-sm"></span> Refreshing…';
    }
    try {
      const res = await app.callServerTool({ name: "config_list_notion_pages", arguments: {} });
      const data = JSON.parse(res.content[0].text);
      state.notionPages = data.pages || [];
      state.isNotionConnected = true;
    } catch (err) {
      console.error("Failed to refresh Notion pages:", err);
    }
    const subContent = document.getElementById("subSessionContent");
    if (subContent) renderNotionSession(subContent);
  };

  /* Sub-session: Database */
  function renderDatabaseSession(container) {
    container.innerHTML = `
      <div class="card" style="text-align:center;padding:32px 16px;">
        <span style="font-size:32px;">🗄️</span>
        <h4 style="margin:8px 0 4px;font-size:15px;">SQL Database Context</h4>
        <p style="color:var(--muted);font-size:12.5px;max-width:440px;margin:0 auto 16px;">
          Select active SQL schemas, tables, and views queryable by Claude.
        </p>
        <span class="badge ok">Ready for queries</span>
      </div>
    `;
  }

  async function saveAppConfig() {
    const btn = document.getElementById("saveAppConfigBtn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span> Saving…';
    setStatus(null, "");

    const activeRepos = Array.from(state.selectedRepos.entries()).map(([name, description]) => ({
      name,
      description: description || "",
    }));

    const activeNotionPages = Array.from(state.selectedNotionPages.values()).map(n => ({
      id: n.id,
      title: n.title || "",
      url: n.url || "",
      description: n.description || "",
      lastEditedTime: n.lastEditedTime || "",
      icon: n.icon || "📄",
    }));

    try {
      const res = await app.callServerTool({
        name: "config_save_app_config",
        arguments: {
          username: state.currentUser?.name || "admin",
          activeRepos,
          activeNotionPages,
          systemPrompt: state.systemPrompt,
        },
      });
      const data = JSON.parse(res.content[0].text);
      if (data.status === "ok") {
        state.updatedAt = data.updatedAt || new Date().toISOString();
        setStatus("ok", "✓ Application configuration saved to Qdrant app-config collection!");
        const ts = document.getElementById("saveTimestamp");
        if (ts) ts.textContent = "Updated: " + new Date().toLocaleTimeString();
      } else {
        setStatus("err", data.message || "Failed to save configuration.");
      }
    } catch (err) {
      setStatus("err", "Error: " + err.message);
    }
    btn.disabled = false;
    btn.innerHTML = "💾 Save Application Configuration";
  }

  /* ------------------- Boot ------------------- */
  await app.connect();
  await checkSetupAndLoad();
</script>
