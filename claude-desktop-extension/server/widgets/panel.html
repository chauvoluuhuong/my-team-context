<div id="root" class="panel-app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Checking Team Context & Connections…</div>
  </div>
</div>

<style>
  :root {
    --bg: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --ok-bg: #ecfdf5;
    --ok-fg: #059669;
    --warn-bg: #fffbeb;
    --warn-fg: #d97706;
    --err-bg: #fef2f2;
    --err-fg: #dc2626;
    --code-bg: #f8fafc;
    --card-bg: #ffffff;
    --card-hover: #f1f5f9;
    --card-selected: #f0fdf4;
    --card-selected-border: #86efac;
    --border: #cbd5e1;
    --purple-bg: #f3e8ff;
    --purple-fg: #7e22ce;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f19;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --line: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #172554;
      --ok-bg: #064e3b;
      --ok-fg: #34d399;
      --warn-bg: #78350f;
      --warn-fg: #fbbf24;
      --err-bg: #7f1d1d;
      --err-fg: #f87171;
      --code-bg: #111827;
      --card-bg: #111827;
      --card-hover: #1e293b;
      --card-selected: #062e24;
      --card-selected-border: #059669;
      --border: #334155;
      --purple-bg: #3b0764;
      --purple-fg: #d8b4fe;
    }
  }

  * {
    box-sizing: border-box;
  }

  .panel-app {
    background: var(--bg);
    color: var(--fg);
    font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    max-width: 720px;
    height: 680px;
    max-height: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  h2 {
    font-size: 16.5px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--code-bg);
    border: 1px solid var(--line);
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .user-badge-role {
    font-size: 10.5px;
    background: var(--accent-light);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 600;
  }

  .btn-signout {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--err-fg);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .btn-signout:hover {
    background: var(--err-bg);
    border-color: var(--err-fg);
  }

  .btn-header-secondary {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--code-bg);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-header-secondary:hover {
    color: var(--fg);
    border-color: var(--border);
  }

  /* Two-Tier Navigation */
  .top-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }

  .top-tab {
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .top-tab:hover {
    color: var(--fg);
    background: var(--card-hover);
  }

  .top-tab.active {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* Content area scrollable container */
  #tabContent {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding-right: 4px;
    min-height: 0;
  }

  #subSessionContent {
    flex: 1;
    overflow-y: auto;
    padding-right: 2px;
    min-height: 0;
  }

  /* Sub-session Pills */
  .sub-pills {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .sub-pill {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sub-pill:hover {
    color: var(--fg);
    border-color: var(--accent);
  }

  .sub-pill.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .section-intro {
    margin-bottom: 14px;
  }

  .section-intro h3 {
    margin: 0 0 4px;
    font-size: 14.5px;
    font-weight: 600;
  }

  .section-intro p {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  /* Form & Cards */
  .card {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px;
    margin-bottom: 12px;
    background: var(--card-bg);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .card-title {
    font-weight: 600;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input[type="text"],
  input[type="password"],
  select,
  textarea {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--code-bg);
    color: var(--fg);
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus,
  input[type="password"]:focus,
  select:focus,
  textarea:focus {
    border-color: var(--accent);
  }

  textarea {
    min-height: 140px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.5;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
  }

  .badge.ok {
    background: var(--ok-bg);
    color: var(--ok-fg);
  }

  .badge.warn {
    background: var(--warn-bg);
    color: var(--warn-fg);
  }

  .badge.err {
    background: var(--err-bg);
    color: var(--err-fg);
  }

  .badge.idle {
    background: var(--code-bg);
    color: var(--muted);
    border: 1px solid var(--line);
  }

  .badge.purple {
    background: var(--purple-bg);
    color: var(--purple-fg);
  }

  .btn-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 14px;
  }

  button {
    font-family: inherit;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  button.primary {
    background: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent);
  }

  button.primary:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  button.secondary {
    background: var(--code-bg);
    color: var(--fg);
    border: 1px solid var(--border);
  }

  button.secondary:hover:not(:disabled) {
    background: var(--card-hover);
    border-color: var(--muted);
  }

  button.danger {
    background: var(--err-bg);
    color: var(--err-fg);
    border: 1px solid var(--err-fg);
  }

  button.danger:hover:not(:disabled) {
    background: var(--err-fg);
    color: #ffffff;
  }

  /* Status message box */
  .status-box {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    display: none;
    line-height: 1.4;
  }

  .status-box.ok {
    display: block;
    background: var(--ok-bg);
    color: var(--ok-fg);
    border: 1px solid var(--ok-fg);
  }

  .status-box.err {
    display: block;
    background: var(--err-bg);
    color: var(--err-fg);
    border: 1px solid var(--err-fg);
  }

  .status-box.warn {
    display: block;
    background: var(--warn-bg);
    color: var(--warn-fg);
    border: 1px solid var(--warn-fg);
  }

  /* Loading Spinner */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .spinner-sm {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  .spinner-dark {
    border: 2px solid var(--line);
    border-top-color: var(--accent);
  }

  /* Reusable Loading Component */
  .loading-component {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    text-align: center;
    width: 100%;
    min-height: 150px;
    color: var(--muted);
    animation: fadeIn 0.2s ease-in-out;
  }

  .loading-spinner-ring {
    width: 32px;
    height: 32px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    margin-bottom: 12px;
  }

  .loading-component-text {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--fg);
    margin-bottom: 4px;
  }

  .loading-component-subtext {
    font-size: 12px;
    color: var(--muted);
    max-width: 400px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* Step Badges & Onboarding Flow */
  .setup-container {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
    padding: 8px 4px;
  }

  .setup-step-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    background: var(--accent-light);
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
    align-self: flex-start;
  }

  /* User Selection Cards Grid */
  .user-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin: 12px 0 16px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .user-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--card-bg);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-card:hover {
    border-color: var(--accent);
    background: var(--card-hover);
    transform: translateY(-1px);
  }

  .user-card.selected {
    border-color: var(--accent);
    background: var(--card-selected);
  }

  .user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .user-info {
    flex: 1;
    min-width: 0;
  }

  .user-name-title {
    font-weight: 600;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .user-role-tag {
    font-size: 11px;
    color: var(--muted);
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Role Selection Pills */
  .role-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
    margin-bottom: 10px;
  }

  .role-pill {
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .role-pill:hover {
    border-color: var(--accent);
    color: var(--fg);
    background: var(--card-hover);
  }

  .role-pill.active {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Countdown Error Banner */
  .countdown-box {
    background: var(--err-bg);
    border: 1px solid var(--err-fg);
    border-radius: 9px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .countdown-timer-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--err-fg);
    margin-top: 10px;
  }

  .progress-bar-bg {
    height: 4px;
    background: rgba(220, 38, 38, 0.2);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--err-fg);
    transition: width 1s linear;
  }

  /* Repo & Notion list items */
  .repo-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }

  .repo-search-input {
    flex: 1;
    padding: 6px 10px;
    font-size: 12.5px;
  }

  .repo-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 280px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .repo-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    background: var(--card-bg);
    transition: all 0.15s ease;
  }

  .repo-item.selected {
    border-color: var(--card-selected-border);
    background: var(--card-selected);
  }

  .repo-main-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .repo-checkbox {
    margin: 0;
    cursor: pointer;
  }

  .repo-name {
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    word-break: break-all;
  }

  .repo-desc-box {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }

  .repo-desc-box input {
    font-size: 12px;
    padding: 5px 8px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }

  .modal-dialog {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    padding: 20px 22px;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
  }

  .btn-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1;
  }

  .btn-close:hover {
    color: var(--fg);
    background: var(--code-bg);
  }

  .preview-box {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: ui-monospace, monospace;
    font-size: 11.5px;
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--fg);
    margin-top: 6px;
  }

  /* Connections Manager Styles */
  .section-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .tab-badge {
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--accent);
    color: #ffffff;
    margin-left: 4px;
    font-weight: 700;
  }

  .btn-add-connection {
    background: var(--accent);
    color: #ffffff;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    transition: all 0.15s ease;
  }

  .btn-add-connection:hover {
    background: var(--accent-hover);
  }

  .connection-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: var(--card-bg);
    transition: border-color 0.15s, box-shadow 0.15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .connection-card:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }

  .connection-card.disabled {
    opacity: 0.65;
    background: var(--code-bg);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .service-meta {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .service-icon-box {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--code-bg);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .service-titles h4 {
    margin: 0;
    font-size: 13.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .service-titles p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--muted);
  }

  .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 2px;
  }

  .card-action-btns {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-action-sm {
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }

  .btn-action-sm:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-action-sm.danger:hover:not(:disabled) {
    border-color: var(--err-fg);
    color: var(--err-fg);
    background: var(--err-bg);
  }

  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 6px;

<script type="module">
  /*__SKILLS_COMPONENT__*/
</script>

<script type="module">
  const { App } = globalThis.ExtApps || {};
  const app = new App({ name: "TeamContextApp", version: "0.1.0" }, {}, { autoResize: true });

  const skillsComponent = new globalThis.SkillsComponent({
    app,
    showHeader: false,
    onUpdate: (skills) => {
      state.skills = skills;
      const pill = document.getElementById("pillSkills");
      if (pill) pill.textContent = `🧠 Team Skills (${skills.length})`;
    },
  });

  const state = {
    viewState: "loading", // "loading" | "error_countdown" | "qdrant_config" | "user_selection" | "main"
    activeTopTab: "credentials", // "credentials" | "config"
    activeSubSession: "github",  // "github" | "prompt" | "notion" | "database"
    currentUser: { name: "", role: "" },
    users: [],
    skills: [],
    qdrant: { configured: false, connected: false, endpoint: "", error: null },
    credentials: {},
    connections: {},
    disabledConnections: new Set(),
    connectionBadges: {},
    teamStatus: {},
    repos: [],
    reposSearch: "",
    selectedRepos: new Map(), // name -> description
    notionPages: [],
    notionPagesSearch: "",
    notionResourceTypeFilter: "all", // "all" | "page" | "database"
    selectedNotionPages: new Map(), // id -> { id, title, description, url, icon, lastEditedTime, type }
    isNotionConnected: false,
    notionBotName: null,
    systemPrompt: "",
    defaultSystemPrompt: "",
    createdAt: "",
    updatedAt: "",
    statusType: null,
    statusMessage: "",
    // Countdown state
    countdownSeconds: 10,
    countdownTimer: null,
    errorMessage: "",
    isSaving: false,
  };

  const root = document.getElementById("root");

  function esc(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderLoadingComponent(message = "Loading…", subtext = "Please wait a moment") {
    return `
      <div class="loading-component">
        <div class="loading-spinner-ring"></div>
        <div class="loading-component-text">${esc(message)}</div>
        ${subtext ? `<div class="loading-component-subtext">${esc(subtext)}</div>` : ""}
      </div>
    `;
  }

  function setStatus(type, msg) {
    state.statusType = type;
    state.statusMessage = msg;
    const box = document.getElementById("statusBox");
    if (box) {
      box.className = "status-box " + (type || "");
      box.textContent = msg || "";
    }
  }

  function setBadge(id, kind, text) {
    const el = document.getElementById("badge-" + id);
    if (el) {
      el.className = "badge " + kind;
      el.textContent = text;
    }
  }

  /* ------------------- Initial Load & Setup Check ------------------- */

  async function checkSetupAndLoad() {
    clearCountdown();
    state.viewState = "loading";
    render();

    try {
      // 1. Centralized setup verification
      const setupRes = await app.callServerTool({
        name: "panel_check_setup",
        arguments: {},
      });
      const setup = JSON.parse(setupRes.content[0].text);

      state.users = setup.users || [];
      state.qdrant = setup.qdrant || {};
      state.currentUser = setup.currentUser || { name: "", role: "" };

      // Also load existing env configuration for prefilling
      try {
        const configRes = await app.callServerTool({ name: "panel_load_config", arguments: {} });
        const cfg = JSON.parse(configRes.content[0].text);
        state.credentials = cfg.config || {};
      } catch {}

      // Check if there is a connection error with Qdrant when Qdrant is already configured
      if (!setup.qdrant?.connected && setup.qdrant?.configured) {
        state.errorMessage = setup.error || setup.qdrant?.error || "Unable to establish connection to Qdrant cluster.";
        startCountdown();
        return;
      }

      // Check setup progression steps
      if (setup.step === "qdrant_config" || !setup.qdrant?.connected) {
        state.viewState = "qdrant_config";
        render();
        return;
      }

      if (setup.step === "user_selection" || !setup.currentUser?.name) {
        state.viewState = "user_selection";
        render();
        return;
      }

      // Setup is completed! Load application configuration state
      await loadAppConfigData();
      state.viewState = "main";
      render();
    } catch (err) {
      console.error("Setup check error:", err);
      state.errorMessage = err.message || "Failed to initialize Team Context.";
      startCountdown();
    }
  }

  function buildDefaultSystemPrompt(context) {
    const userName = (context && context.userName) || state.currentUser?.name || "Team Member";
    const userRole = (context && context.userRole) || (state.currentUser?.role ? ` (${state.currentUser.role})` : "");
    const repos = (context && context.activeRepos) || Array.from(state.selectedRepos.keys());

    let activeReposStr = "None configured";
    const activeRepoList = Array.isArray(repos) ? repos : [];
    if (activeRepoList.length > 0) {
      activeReposStr = activeRepoList
        .map(r => (typeof r === "string" ? (state.selectedRepos.get(r) ? `${r} (${state.selectedRepos.get(r)})` : r) : r.description ? `${r.name} (${r.description})` : r.name))
        .join(", ");
    }

    let activeNotionStr = "All workspace documentation accessible";
    const activePages = (context && context.activeNotionPages) || Array.from(state.selectedNotionPages.values());
    if (activePages && activePages.length > 0) {
      const formatted = activePages.map(p => {
        if (typeof p === "string") return p;
        const icon = p.icon || (p.type === "database" ? "🗄️" : "📄");
        const title = p.title || p.id || "Untitled";
        const desc = p.description ? ` (${p.description})` : "";
        const typeBadge = p.type === "database" ? " [Database]" : "";
        return `${icon} ${title}${typeBadge}${desc}`;
      }).filter(Boolean);
      if (formatted.length > 0) {
        activeNotionStr = formatted.join(", ");
      }
    }

    return `You are my Team Assistant and Engineering Co-Pilot helping me understand and navigate the context of our team's work.

Current User: ${userName}${userRole}
Active Repositories: ${activeReposStr}
Active Notion Resources: ${activeNotionStr}

Please assist me throughout our work by using the \`my-team-context-mcp-server\` tools:
1. Team Knowledge & Skills: Query our vector knowledge base with \`skills_search\` and \`get_skills\` to retrieve relevant engineering procedures, guidelines, and playbooks.
2. Codebase Context: Consult our configured GitHub repositories for codebase architecture, style conventions, and implementation patterns.
3. Project Specifications: Access our Notion workspace documents for product requirements and specifications.
4. Design & Goals: When creating UI mockups, designing components, or building features, align strictly with our team's branding colors, design system, and project goals.
5. SQL Database Querying: Use \`sql_get_schema\` and \`sql_execute_query\` to inspect database schemas, write optimized SQL queries, and analyze data for our team.

Safety & Approvals:
- Always ask for explicit user approval before executing any actions that edit or modify data (including INSERT, UPDATE, DELETE, ALTER, DROP in the database, editing or creating Notion pages, or modifying skills/configurations).

Please confirm you are ready to assist with our team context and give a brief greeting!`;
  }

  async function loadAppConfigData() {
    try {
      const appStateRes = await app.callServerTool({
        name: "config_get_app_state",
        arguments: { username: state.currentUser?.name || undefined }
      });
      const appData = JSON.parse(appStateRes.content[0].text);

      state.repos = appData.repos || [];
      state.isNotionConnected = Boolean(appData.isNotionConnected);
      state.notionBotName = appData.notionBotName || null;
      state.notionPages = appData.notionPages || [];

      const appConfig = appData.appConfig || {};
      const remoteConns = appConfig.connections || {};
      // Merge remote connections preserving any locally active state
      state.connections = Object.assign({}, state.connections, remoteConns);
      state.disabledConnections.clear();
      Object.keys(state.connections).forEach(serviceId => {
        const conn = state.connections[serviceId];
        if (conn) {
          if (conn.enabled === false) {
            state.disabledConnections.add(serviceId);
          }
          if (conn.credentials) {
            Object.assign(state.credentials, conn.credentials);
          }
        }
      });

      state.selectedRepos.clear();
      (appConfig.activeRepos || []).forEach(r => {
        if (r && r.name) state.selectedRepos.set(r.name, r.description || "");
      });

      state.selectedNotionPages.clear();
      (appConfig.activeNotionPages || []).forEach(n => {
        if (n && n.id) {
          state.selectedNotionPages.set(n.id, {
            id: n.id,
            title: n.title || "",
            url: n.url || "",
            description: n.description || "",
            lastEditedTime: n.lastEditedTime || "",
            icon: n.icon || (n.type === "database" ? "🗄️" : "📄"),
            type: n.type === "database" ? "database" : "page",
          });
        }
      });

      state.defaultSystemPrompt = appData.defaultSystemPrompt || buildDefaultSystemPrompt();

      // If app config has no custom system prompt yet, initialize and store the default prompt
      if (!appConfig.systemPrompt || !appConfig.systemPrompt.trim()) {
        state.systemPrompt = state.defaultSystemPrompt;
        const activeRepos = Array.from(state.selectedRepos.entries()).map(([name, description]) => ({ name, description }));
        const activeNotionPages = Array.from(state.selectedNotionPages.values());
        await app.callServerTool({
          name: "config_save_app_config",
          arguments: {
            username: state.currentUser?.name || "admin",
            activeRepos,
            activeNotionPages,
            connections: state.connections || {},
            systemPrompt: state.systemPrompt,
          },
        }).catch(err => console.warn("Could not auto-persist default system prompt:", err));
      } else {
        state.systemPrompt = appConfig.systemPrompt;
      }

      state.createdAt = appConfig.createdAt || "";
      state.updatedAt = appConfig.updatedAt || "";
    } catch (err) {
      console.warn("Could not load full app config data:", err);
    }
  }

  /* ------------------- Countdown Handler ------------------- */

  function startCountdown() {
    clearCountdown();
    state.countdownSeconds = 10;
    state.viewState = "error_countdown";
    render();

    state.countdownTimer = setInterval(() => {
      state.countdownSeconds -= 1;
      const secEl = document.getElementById("countdownSeconds");
      const fillEl = document.getElementById("countdownProgressFill");
      if (secEl) secEl.textContent = state.countdownSeconds + "s";
      if (fillEl) fillEl.style.width = ((state.countdownSeconds / 10) * 100) + "%";

      if (state.countdownSeconds <= 0) {
        clearCountdown();
        state.viewState = "qdrant_config";
        render();
      }
    }, 1000);
  }

  function clearCountdown() {
    if (state.countdownTimer) {
      clearInterval(state.countdownTimer);
      state.countdownTimer = null;
    }
  }

  /* ------------------- View Router ------------------- */

  function render() {
    if (state.viewState === "loading") {
      renderLoading();
      return;
    }

    if (state.viewState === "error_countdown") {
      renderErrorCountdown();
      return;
    }

    if (state.viewState === "qdrant_config") {
      renderQdrantConfigStep();
      return;
    }

    if (state.viewState === "user_selection") {
      renderUserSelectionStep();
      return;
    }

    if (state.viewState === "main") {
      renderMainDashboard();
      return;
    }
  }

  /* ------------------- View 0: Loading ------------------- */

  /* ------------------- View 0: Loading ------------------- */

  function renderLoading() {
    root.innerHTML = renderLoadingComponent(
      "Connecting to Team Context & Vector Database…",
      "Validating cluster status and loading team configurations"
    );
  }

  /* ------------------- View 1: Error & Countdown ------------------- */

  function renderErrorCountdown() {
    const pct = (state.countdownSeconds / 10) * 100;
    root.innerHTML = `
      <div class="header">
        <h2>⚡ Team Context</h2>
      </div>
      <div class="setup-container">
        <div class="countdown-box">
          <div style="display:flex;align-items:flex-start;gap:10px;">
            <span style="font-size:22px;line-height:1;">⚠️</span>
            <div style="flex:1;">
              <h3 style="margin:0 0 6px;font-size:14.5px;color:var(--err-fg);">Connection Error</h3>
              <p style="margin:0;font-size:12.5px;color:var(--fg);word-break:break-word;">
                ${esc(state.errorMessage || "Could not reach Qdrant vector database.")}
              </p>
            </div>
          </div>

          <div class="countdown-timer-line">
            <span>Auto-navigating to settings in:</span>
            <strong id="countdownSeconds">${state.countdownSeconds}s</strong>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="countdownProgressFill" style="width:${pct}%"></div>
          </div>
        </div>

        <div class="card" style="text-align:center;padding:24px 16px;">
          <p style="margin:0 0 16px;color:var(--muted);font-size:13px;">
            You can verify and update your Qdrant cluster endpoint URL, API key, and Gemini API key to restore service.
          </p>
          <div class="btn-row" style="justify-content:center;gap:10px;">
            <button class="primary" id="btnGoToSettingsNow">⚙️ Configure Settings Now</button>
            <button class="secondary" id="btnRetryCheck">🔄 Retry Connection</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById("btnGoToSettingsNow")?.addEventListener("click", () => {
      clearCountdown();
      state.viewState = "qdrant_config";
      render();
    });

    document.getElementById("btnRetryCheck")?.addEventListener("click", () => {
      checkSetupAndLoad();
    });
  }

  /* ------------------- View 2: Step 1 Vector DB & Gemini AI Setup ------------------- */

  function renderQdrantConfigStep() {
    const qdrantUrl = state.credentials.QDRANT_URL || "";
    const qdrantKey = state.credentials.QDRANT_API_KEY || "";
    const geminiKey = state.credentials.GEMINI_API_KEY || "";

    root.innerHTML = `
      <div class="header">
        <h2>⚡ Team Context Setup</h2>
      </div>

      <div class="setup-container">
        <span class="setup-step-pill">Step 1 of 2</span>
        <div class="section-intro">
          <h3>🧠 Vector Database & AI Embeddings Setup</h3>
          <p>Configure your Qdrant vector cluster and Google Gemini API key. Both are required to initialize team memory.</p>
        </div>

        <div class="card">
          <div class="field-group">
            <label class="field-label" for="setupQdrantUrl">
              Qdrant Cluster Endpoint URL <span style="color:var(--err-fg);font-weight:700;">*</span>
            </label>
            <input type="text" id="setupQdrantUrl" placeholder="https://xxx.cloud.qdrant.io" value="${esc(qdrantUrl)}" />
            <span style="font-size:11px;color:var(--muted);margin-top:2px;">
              e.g. <code>https://xxx.eu-west-2-0.aws.cloud.qdrant.io</code> or <code>http://localhost:6333</code>
            </span>
          </div>

          <div class="field-group" style="margin-top:12px;">
            <label class="field-label" for="setupQdrantKey">Qdrant API Key</label>
            <input type="password" id="setupQdrantKey" placeholder="Enter API key (optional for local clusters)" value="${esc(qdrantKey)}" />
          </div>

          <div class="field-group" style="margin-top:12px;">
            <label class="field-label" for="setupGeminiKey" style="display:flex; justify-content:space-between; align-items:center;">
              <span>✨ Google Gemini API Key <span style="color:var(--err-fg);font-weight:700;">* Obligatory</span></span>
              <a href="https://aistudio.google.com/app/apikey" target="_blank" style="font-size:11px; color:var(--accent); text-decoration:none;">Get key ↗</a>
            </label>
            <input type="password" id="setupGeminiKey" placeholder="AIzaSy…" value="${esc(geminiKey)}" />
            <span style="font-size:11px;color:var(--muted);margin-top:2px;">
              Required for <code>text-embedding-004</code>. Generates high-dimensional vectors for semantic search.
            </span>
          </div>

          <div class="btn-row" style="margin-top:16px;">
            <button class="primary" id="btnConnectQdrant" ${state.isSaving ? "disabled" : ""}>
              ${state.isSaving ? '<span class="spinner-sm"></span> Testing & Connecting…' : "⚡ Test Connections & Continue →"}
            </button>
          </div>

          <div id="statusBox" class="${state.statusType ? 'status-box ' + state.statusType : 'status-box'}">${esc(state.statusMessage)}</div>
        </div>
      </div>
    `;

    document.getElementById("btnConnectQdrant")?.addEventListener("click", handleSaveQdrantConfig);
  }

  async function handleSaveQdrantConfig() {
    const url = document.getElementById("setupQdrantUrl")?.value.trim();
    const apiKey = document.getElementById("setupQdrantKey")?.value.trim();
    const geminiKey = document.getElementById("setupGeminiKey")?.value.trim();

    if (!url) {
      setStatus("err", "Please enter a Qdrant cluster endpoint URL.");
      return;
    }
    if (!geminiKey) {
      setStatus("err", "Gemini API Key is obligatory. Please enter your Google AI Studio API key.");
      return;
    }

    state.isSaving = true;
    setStatus(null, "");
    render();

    try {
      const res = await app.callServerTool({
        name: "panel_save_qdrant_config",
        arguments: { qdrantUrl: url, qdrantApiKey: apiKey || undefined, geminiApiKey: geminiKey },
      });
      const data = JSON.parse(res.content[0].text);

      if (data.success) {
        state.credentials.QDRANT_URL = data.endpoint || url;
        state.credentials.QDRANT_API_KEY = apiKey;
        state.credentials.GEMINI_API_KEY = geminiKey;
        state.qdrant.connected = true;
        state.qdrant.endpoint = data.endpoint || url;
        state.users = data.users || [];
        state.isSaving = false;
        state.viewState = "user_selection";
        render();
      } else {
        state.isSaving = false;
        render();
        setStatus("err", data.reason || "Failed to validate configuration.");
      }
    } catch (err) {
      state.isSaving = false;
      render();
      setStatus("err", "Connection error: " + err.message);
    }
  }

  const PREDEFINED_ROLES = [
    "Full Stack Engineer",
    "Frontend Developer",
    "Backend Developer",
    "Tech Lead / Architect",
    "DevOps / Platform Engineer",
    "QA / Test Engineer",
    "Mobile Developer",
    "Product Manager",
    "UI/UX Designer",
    "Data / AI Engineer",
  ];

  /* ------------------- View 3: Step 2 User Selection / Creation ------------------- */

  function renderUserSelectionStep() {
    const hasUsers = state.users && state.users.length > 0;
    const currentSelectedRole = state.selectedNewUserRole || PREDEFINED_ROLES[0];

    root.innerHTML = `
      <div class="header">
        <h2>⚡ Team Context Setup</h2>
        <div class="header-actions">
          <button class="btn-header-secondary" id="btnBackToQdrant">⚙️ Change Qdrant</button>
        </div>
      </div>

      <div class="setup-container">
        <span class="setup-step-pill">Step 2 of 2</span>
        <div class="section-intro">
          <h3>👤 Select or Create Your Profile</h3>
          <p>Select who you are from the team database or register a new team profile. Your selection will be stored in <code>server/.env</code>.</p>
        </div>

        ${hasUsers ? `
          <div class="card">
            <div class="card-header">
              <span class="card-title">👥 Existing Team Members (${state.users.length})</span>
              <span style="font-size:11.5px;color:var(--muted);">Click card to select</span>
            </div>

            <div class="user-grid">
              ${state.users.map(u => {
                const initial = (u.name || "?").charAt(0).toUpperCase();
                return `
                  <div class="user-card" onclick="window._selectExistingUser('${esc(u.name)}', '${esc(u.role || 'Member')}')">
                    <div class="user-avatar">${esc(initial)}</div>
                    <div class="user-info">
                      <div class="user-name-title">${esc(u.name)}</div>
                      <span class="user-role-tag">${esc(u.role || "Member")}</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        ` : `
          <div class="card" style="text-align:center;padding:18px 12px;margin-bottom:12px;">
            <p style="margin:0;font-size:12.5px;color:var(--muted);">No team members registered yet in Qdrant users collection.</p>
          </div>
        `}

        <!-- Create New User Section -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">➕ Create New Team Profile</span>
          </div>

          <div class="field-group" style="margin-bottom:10px;">
            <label class="field-label" for="newUserName">Your Name</label>
            <input type="text" id="newUserName" placeholder="e.g. Huong, Alice, Bob" />
          </div>

          <div class="field-group">
            <label class="field-label">Select Role or Type Custom Role</label>
            
            <!-- Quick Role Select Pills -->
            <div class="role-pills" id="rolePillsContainer">
              ${PREDEFINED_ROLES.map(r => `
                <span class="role-pill ${r === currentSelectedRole ? 'active' : ''}" onclick="window._selectRolePill('${esc(r)}')">
                  ${esc(r)}
                </span>
              `).join('')}
            </div>

            <!-- Custom Role Input -->
            <input type="text" id="newUserRole" placeholder="Custom role (e.g. Lead, Developer, QA)" value="${esc(currentSelectedRole)}" />
          </div>

          <div class="btn-row" style="margin-top:14px;">
            <button class="primary" id="btnCreateUser" ${state.isSaving ? "disabled" : ""}>
              ${state.isSaving ? '<span class="spinner-sm"></span> Creating Profile…' : "✨ Create & Continue →"}
            </button>
          </div>

          <div id="statusBox" class="${state.statusType ? 'status-box ' + state.statusType : 'status-box'}">${esc(state.statusMessage)}</div>
        </div>
      </div>
    `;

    document.getElementById("newUserRole")?.addEventListener("input", (e) => {
      state.selectedNewUserRole = e.target.value;
      // Update pills active class
      const pills = document.querySelectorAll(".role-pill");
      pills.forEach(p => {
        if (p.textContent.trim() === e.target.value.trim()) p.classList.add("active");
        else p.classList.remove("active");
      });
    });

    document.getElementById("btnBackToQdrant")?.addEventListener("click", () => {
      state.viewState = "qdrant_config";
      render();
    });

    document.getElementById("btnCreateUser")?.addEventListener("click", handleCreateNewUser);
  }

  window._selectRolePill = function(role) {
    state.selectedNewUserRole = role;
    const input = document.getElementById("newUserRole");
    if (input) input.value = role;
    const pills = document.querySelectorAll(".role-pill");
    pills.forEach(p => {
      if (p.textContent.trim() === role) p.classList.add("active");
      else p.classList.remove("active");
    });
  };

  window._selectExistingUser = async function(name, role) {
    if (!name) return;
    state.isSaving = true;
    render();

    try {
      const res = await app.callServerTool({
        name: "panel_select_user",
        arguments: { name, role },
      });
      const data = JSON.parse(res.content[0].text);
      if (data.success) {
        state.currentUser = { name, role: role || "Member" };
        state.isSaving = false;
        await loadAppConfigData();
        state.viewState = "main";
        render();
      } else {
        state.isSaving = false;
        render();
        setStatus("err", data.reason || "Failed to select user.");
      }
    } catch (err) {
      state.isSaving = false;
      render();
      setStatus("err", "Error: " + err.message);
    }
  };

  async function handleCreateNewUser() {
    const name = document.getElementById("newUserName")?.value.trim();
    const roleInput = document.getElementById("newUserRole")?.value.trim();
    const role = roleInput || state.selectedNewUserRole || "Full Stack Engineer";

    if (!name) {
      setStatus("err", "Please enter your name.");
      return;
    }

    state.isSaving = true;
    setStatus(null, "");
    render();

    try {
      const res = await app.callServerTool({
        name: "panel_create_user",
        arguments: { name, role },
      });
      const data = JSON.parse(res.content[0].text);
      if (data.success) {
        state.currentUser = { name, role };
        state.isSaving = false;
        await loadAppConfigData();
        state.viewState = "main";
        render();
      } else {
        state.isSaving = false;
        render();
        setStatus("err", data.reason || "Failed to create user.");
      }
    } catch (err) {
      state.isSaving = false;
      render();
      setStatus("err", "Error: " + err.message);
    }
  }

  /* ------------------- Services Catalog & Connection Definitions ------------------- */

  function isServiceConfigured(id) {
    const conn = state.connections?.[id];
    if (conn && conn.credentials) {
      const hasCred = Object.values(conn.credentials).some(v => Boolean(v && String(v).trim()));
      if (hasCred) return true;
    }
    const meta = SERVICES_CATALOG[id];
    if (meta && meta.fields) {
      return meta.fields.some(f => Boolean(state.credentials?.[f.key] && String(state.credentials[f.key]).trim()));
    }
    return false;
  }

  /* ------------------- Connection Manager Actions & Modals ------------------- */

  window._closeConnModal = function() {

  };

    }

  window._openConfigureModal = function(serviceId) {
    const meta = SERVICES_CATALOG[serviceId];
    if (!meta) return;

    const modalContainer = document.getElementById("modalContainer");
    if (!modalContainer) return;

    const existingVals = Object.assign({}, state.credentials, state.connections?.[serviceId]?.credentials || {});
    let fieldsHtml = "";
    meta.fields.forEach(f => {
      const val = existingVals[f.key] || "";
      fieldsHtml += `
        <div class="field-group" style="margin-bottom:10px;">
          <label class="field-label" for="modal_input_${f.key}">${f.label}</label>
          <input type="${f.type}" id="modal_input_${f.key}" placeholder="${f.placeholder}" value="${esc(val)}" />
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">${f.help}</div>
        </div>
      `;
    });

    modalContainer.innerHTML = `
      <div class="modal-overlay" id="connModalOverlay" onclick="if(event.target === this) window._closeConnModal()">
        <div class="modal-dialog">
          <div class="modal-header">
            <h3 class="modal-title">${meta.icon} Configure ${meta.name}</h3>
            <button class="btn-close" onclick="window._closeConnModal()">✕</button>
          </div>
          <p style="margin:0 0 12px;font-size:12.5px;color:var(--muted);">
            ${meta.description}
          </p>
          <div id="modalFieldsContainer">
            ${fieldsHtml}
          </div>

          <div id="modalTestStatus" style="display:none;padding:8px 10px;border-radius:6px;font-size:12px;margin:8px 0;"></div>

          <div class="btn-row" style="margin-top:16px;justify-content:space-between;">
            <button class="secondary" id="btnModalTestConn" onclick="window._runModalTest('${serviceId}')">
              🧪 Test Connection
            </button>
            <div style="display:flex;gap:6px;">
              <button class="secondary" onclick="window._closeConnModal()">Cancel</button>
              <button class="primary" id="btnModalSaveConn" onclick="window._saveConnectionFromModal('${serviceId}')">
                💾 Save Connection
              </button>
            </div>
          </div>
        </div>
      </div>
    `;
  };

  window._runModalTest = async function(serviceId) {
    const meta = SERVICES_CATALOG[serviceId];
    const testBtn = document.getElementById("btnModalTestConn");
    const statusBox = document.getElementById("modalTestStatus");
    if (!statusBox) return;

    const values = {};
    meta.fields.forEach(f => {
      const el = document.getElementById(`modal_input_${f.key}`);
      if (el) values[f.key] = el.value.trim();
    });

    if (testBtn) {
      testBtn.disabled = true;
      testBtn.innerHTML = '<span class="spinner-sm"></span> Testing…';
    }

    try {
      const d = await testSingleServiceConnection(serviceId, values);
      statusBox.style.display = "block";
      if (d.ok) {
        statusBox.style.background = "var(--ok-bg)";
        statusBox.style.color = "var(--ok-fg)";
        statusBox.style.border = "1px solid var(--ok-fg)";
        statusBox.innerHTML = `✓ Connection verified! Authenticated as <strong>${esc(d.login || d.botName || d.model || d.dialect || "Connected")}</strong>.`;
      } else {
        statusBox.style.background = "var(--err-bg)";
        statusBox.style.color = "var(--err-fg)";
        statusBox.style.border = "1px solid var(--err-fg)";
        statusBox.innerHTML = `✕ Verification failed: ${esc(d.reason || "Unable to connect.")}`;
      }
    } catch (err) {
      statusBox.style.display = "block";
      statusBox.style.background = "var(--err-bg)";
      statusBox.style.color = "var(--err-fg)";
      statusBox.style.border = "1px solid var(--err-fg)";
      statusBox.innerHTML = `✕ Error: ${esc(err.message)}`;
    }

    if (testBtn) {
      testBtn.disabled = false;
      testBtn.innerHTML = '🧪 Test Connection';
    }
  };

  window._saveConnectionFromModal = async function(serviceId) {
    const meta = SERVICES_CATALOG[serviceId];
    const saveBtn = document.getElementById("btnModalSaveConn");
    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="spinner-sm"></span> Saving…';
    }

    const serviceCreds = {};
    meta.fields.forEach(f => {
      const el = document.getElementById(`modal_input_${f.key}`);
      if (el) serviceCreds[f.key] = el.value.trim();
    });

    try {
      let res;
      if (serviceId === "qdrant" || serviceId === "gemini") {
        const updatedCreds = { ...state.credentials, ...serviceCreds };
        res = await app.callServerTool({
          name: "panel_save_all_credentials",
          arguments: updatedCreds
        });
      } else {
        // Save to appConfig, NOT .env!
        res = await app.callServerTool({
          name: "panel_save_connection",
          arguments: {
            username: state.currentUser?.name || undefined,
            service: serviceId,
            credentials: serviceCreds,
            enabled: true,
          }
        });
      }
      const data = JSON.parse(res.content[0].text);
      if (data.status === "ok") {
        Object.assign(state.credentials, serviceCreds);
        if (!state.connections) state.connections = {};
        state.connections[serviceId] = {
          id: serviceId,
          enabled: true,
          credentials: serviceCreds,
          updatedAt: new Date().toISOString(),
        };
        state.disabledConnections.delete(serviceId);
        state.connectionBadges[serviceId] = { type: "ok", text: "✓ Connected" };

        // 1. Close modal and RENDER IMMEDIATELY so the card is visible without any delay
        window._closeConnModal();
        render();
        setStatus("ok", `✓ ${meta.name} connection saved to appConfig!`);

        // 2. Refresh repos/notion pages in background without blocking UI
        loadAppConfigData().then(() => {
          render();
        }).catch(err => console.warn("Background config reload warning:", err));

        return;
      } else {
        setStatus("err", data.message || `Failed to save ${meta.name} connection.`);
      }
    } catch (err) {
      setStatus("err", "Error saving connection: " + err.message);
    }

    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '💾 Save Connection';
    }
  };

  window._toggleConnection = async function(serviceId) {
    const isDisabled = state.disabledConnections.has(serviceId);
    const meta = SERVICES_CATALOG[serviceId];

    if (isDisabled) {
      state.disabledConnections.delete(serviceId);
      if (state.connections?.[serviceId]) state.connections[serviceId].enabled = true;
      setStatus("ok", `Enabled ${meta?.name || serviceId}.`);
    } else {
      state.disabledConnections.add(serviceId);
      if (state.connections?.[serviceId]) state.connections[serviceId].enabled = false;
      setStatus(null, `Disabled ${meta?.name || serviceId}.`);
    }

    // Render immediately for instant toggle response
    render();

    if (state.connections?.[serviceId] && serviceId !== "qdrant" && serviceId !== "gemini") {
      try {
        await app.callServerTool({
          name: "panel_save_connection",
          arguments: {
            username: state.currentUser?.name || undefined,
            service: serviceId,
            credentials: state.connections[serviceId].credentials || {},
            enabled: !isDisabled,
          }
        });
      } catch (e) {
        console.warn("Could not sync toggle to appConfig:", e);
      }
    }
  };

  window._disconnectConnection = async function(serviceId) {
    const meta = SERVICES_CATALOG[serviceId];
    if (!meta) return;

    if (!confirm(`Disconnect ${meta.name}? This will remove its connection and credentials from appConfig.`)) {
      return;
    }

    // Optimistically remove and re-render immediately
    if (state.connections) delete state.connections[serviceId];
    meta.fields.forEach(f => { delete state.credentials[f.key]; });
    state.disabledConnections.delete(serviceId);
    delete state.connectionBadges[serviceId];
    render();
    setStatus(null, `Disconnecting ${meta.name}…`);

    try {
      if (serviceId === "qdrant" || serviceId === "gemini") {
        const updatedCreds = { ...state.credentials };
        meta.fields.forEach(f => { updatedCreds[f.key] = ""; });
        await app.callServerTool({
          name: "panel_save_all_credentials",
          arguments: updatedCreds
        });
      } else {
        // Remove from appConfig
        await app.callServerTool({
          name: "panel_remove_connection",
          arguments: {
            username: state.currentUser?.name || undefined,
            service: serviceId,
          }
        });
      }

      setStatus("ok", `✓ Disconnected ${meta.name} and removed from appConfig.`);
      loadAppConfigData().then(() => render()).catch(() => {});
    } catch (err) {
      setStatus("err", `Failed to disconnect ${meta.name}: ${err.message}`);
    }
  };

  async function testSingleServiceConnection(serviceId, vals) {
    const connCreds = state.connections?.[serviceId]?.credentials || {};
    const creds = vals || Object.assign({}, state.credentials, connCreds);
    let testArgs = { service: serviceId };
    if (serviceId === "github") testArgs.githubToken = creds.GITHUB_TOKEN || "";
    else if (serviceId === "notion") testArgs.notionApiKey = creds.NOTION_API_KEY || "";
    else if (serviceId === "qdrant") {
      testArgs.qdrantUrl = creds.QDRANT_URL || "";
      testArgs.qdrantApiKey = creds.QDRANT_API_KEY || "";
    } else if (serviceId === "gemini") testArgs.geminiApiKey = creds.GEMINI_API_KEY || "";
    else if (serviceId === "sql") testArgs.databaseUrl = creds.DATABASE_URL || "";

    const res = await app.callServerTool({
      name: "panel_test_connection",
      arguments: testArgs
    });
    return JSON.parse(res.content[0].text);
  }

  window._testSingleConnection = async function(serviceId) {
    const meta = SERVICES_CATALOG[serviceId];
    setBadge(serviceId, "idle", "Testing…");
    setStatus(null, "");

    try {
      const d = await testSingleServiceConnection(serviceId);
      if (d.ok) {
        const detail = d.login || d.botName || d.model || d.dialect || "Connected";
        setBadge(serviceId, "ok", "✓ " + detail);
        state.connectionBadges[serviceId] = { type: "ok", text: "✓ " + detail };
        setStatus("ok", `✓ ${meta.name} connection test succeeded!`);
      } else {
        setBadge(serviceId, "err", "Failed");
        state.connectionBadges[serviceId] = { type: "err", text: "Failed" };
        setStatus("err", `${meta.name}: ${d.reason || "Connection failed."}`);
      }
    } catch (err) {
      setBadge(serviceId, "err", "Error");
      state.connectionBadges[serviceId] = { type: "err", text: "Error" };
      setStatus("err", `${meta.name} test error: ${err.message}`);
    }
  };

  /* Sub-session: GitHub */

  /* ------------------- Centralized Skill Name & Modal Flow ------------------- */

  function formatSkillName(repo, filePath, title) {
    const cleanRepo = (repo || "").trim();
    const cleanPath = (filePath || "").trim().replace(/^\/+/, "");
    const baseName = title && title.trim()
      ? title.trim()
      : (cleanPath.split("/").pop().replace(/\.[^/.]+$/, ""));
    return `[github-repo: ${cleanRepo}, path: ${cleanPath}] ${baseName}`;
  }

  window._mdFilesCache = window._mdFilesCache || {};
  window._mdSelectedCache = window._mdSelectedCache || {};

  window._scanMdFiles = async function(repo) {
    const safeId = repo.replace(/[^a-zA-Z0-9_-]/g, '_');
    const cont = document.getElementById("md-list-" + safeId);
    if (!cont) return;
    cont.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:6px 0;display:flex;align-items:center;gap:6px;"><span class="spinner-sm spinner-dark"></span> Scanning repository for .md files…</div>';

    try {
      const res = await app.callServerTool({ name: "config_list_repo_md_files", arguments: { repo } });
      const data = JSON.parse(res.content[0].text);
      const files = data.mdFiles || [];
      window._mdFilesCache[repo] = files;
      window._mdSelectedCache[repo] = new Set(files.map(f => f.path));

      renderMdFileList(repo, safeId);
    } catch (err) {
      cont.innerHTML = `<div style="font-size:12px;color:var(--err-fg);padding:4px 0;">Failed to scan: ${esc(err.message)}</div>`;
    }
  };

  function renderMdFileList(repo, safeId) {
    const cont = document.getElementById("md-list-" + safeId);
    if (!cont) return;
    const files = window._mdFilesCache[repo] || [];
    const selected = window._mdSelectedCache[repo] || new Set();

    if (files.length === 0) {
      cont.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:4px 0;">No .md files found in this repository.</div>';
      return;
    }

    cont.innerHTML = `
      <div style="margin-top:6px;border-top:1px dashed var(--line);padding-top:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:11.5px;color:var(--muted);font-weight:600;">Found ${files.length} .md files (${selected.size} selected)</span>
          <div style="display:flex;gap:4px;">
            <button class="secondary" style="font-size:10.5px;padding:2px 6px;" onclick="window._toggleAllMd('${esc(repo)}', true)">All</button>

          </div>
        </div>
        <div style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:8px;padding-right:4px;">
          ${files.map(f => {
            const isChecked = selected.has(f.path);
            return `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 8px;border-radius:6px;background:var(--card-bg);border:1px solid var(--border);">
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;flex:1;min-width:0;">
                  <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="window._toggleMdItem('${esc(repo)}', '${esc(f.path)}', this.checked)" />
                  <span style="font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all;">${esc(f.path)}</span>
                  ${f.size ? `<span style="font-size:10px;color:var(--muted);">(${Math.round(f.size / 1024)} KB)</span>` : ''}
                </label>
                <div style="display:flex;align-items:center;gap:6px;">
                  ${f.isSynced ? '<span class="badge ok" style="font-size:10px;padding:1px 6px;">✓ Synced</span>' : '<span class="badge idle" style="font-size:10px;padding:1px 6px;">New</span>'}
                  <button class="secondary" style="font-size:11px;padding:2px 7px;" onclick="window._openMdModal('${esc(repo)}', '${esc(f.path)}')">

          }).join('')}

          <button class="primary" style="font-size:11.5px;padding:4px 10px;" onclick="window._syncMdFiles('${esc(repo)}')">

          </button>
          <span id="md-sync-status-${safeId}" style="font-size:11.5px;"></span>
        </div>
      </div>
    `;
  }

  window._toggleAllMd = function(repo, selectAll) {
    const files = window._mdFilesCache[repo] || [];
    if (selectAll) {
      window._mdSelectedCache[repo] = new Set(files.map(f => f.path));
    } else {
      window._mdSelectedCache[repo] = new Set();
    }
    const safeId = repo.replace(/[^a-zA-Z0-9_-]/g, '_');
    renderMdFileList(repo, safeId);
  };

  window._toggleMdItem = function(repo, filePath, isChecked) {
    const selected = window._mdSelectedCache[repo] || new Set();
    if (isChecked) selected.add(filePath);
    else selected.delete(filePath);
    window._mdSelectedCache[repo] = selected;
    const safeId = repo.replace(/[^a-zA-Z0-9_-]/g, '_');
    renderMdFileList(repo, safeId);
  };
