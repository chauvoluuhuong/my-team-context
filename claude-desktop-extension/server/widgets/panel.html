<div id="root" class="panel-app">
  <div class="loading">Loading Credentials…</div>
</div>

<style>
  :root {
    --bg: #ffffff;
    --fg: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --ok-bg: #ecfdf5;
    --ok-fg: #059669;
    --warn-bg: #fffbeb;
    --warn-fg: #d97706;
    --err-bg: #fef2f2;
    --err-fg: #dc2626;
    --code-bg: #f8fafc;
    --card-bg: #ffffff;
    --card-hover: #f1f5f9;
    --border: #cbd5e1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f19;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --line: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #172554;
      --ok-bg: #064e3b;
      --ok-fg: #34d399;
      --warn-bg: #78350f;
      --warn-fg: #fbbf24;
      --err-bg: #7f1d1d;
      --err-fg: #f87171;
      --code-bg: #111827;
      --card-bg: #111827;
      --card-hover: #1e293b;
      --border: #334155;
    }
  }

  * {
    box-sizing: border-box;
  }

  .panel-app {
    background: var(--bg);
    color: var(--fg);
    font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    max-width: 680px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  h2 {
    font-size: 16.5px;
    font-weight: 700;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sub {
    margin: 0 0 16px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .user-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--code-bg);
    border: 1px solid var(--line);
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-signout {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--err-fg);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .btn-signout:hover {
    background: var(--err-bg);
    border-color: var(--err-fg);
  }

  .card {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px;
    margin-bottom: 12px;
    background: var(--card-bg);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .card-title {
    font-weight: 600;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .field-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }

  .field-group:last-child {
    margin-bottom: 0;
  }

  .field-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--code-bg);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--accent);
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  button.primary {
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.primary:hover {
    background: var(--accent-hover);
  }

  button.primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  button.secondary {
    background: var(--code-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button.secondary:hover {
    background: var(--card-hover);
  }

  button.secondary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .badge.err { background: var(--err-bg); color: var(--err-fg); }
  .badge.idle { background: var(--code-bg); color: var(--muted); border: 1px solid var(--border); }

  .status-box {
    margin-top: 14px;
    padding: 9px 12px;
    border-radius: 7px;
    font-size: 12.5px;
    display: none;
  }

  .status-box.ok { display: block; background: var(--ok-bg); color: var(--ok-fg); }
  .status-box.err { display: block; background: var(--err-bg); color: var(--err-fg); }

  .loading {
    color: var(--muted);
    padding: 16px 0;
    text-align: center;
  }
</style>

<script>
  /*__EXT_APPS_BUNDLE__*/
</script>

<script type="module">
  const { App } = globalThis.ExtApps || {};
  const app = new App({ name: "TeamContextCredentialsApp", version: "0.1.0" }, {}, { autoResize: true });

  const state = {
    auth: { hasAccount: false, isAuthenticated: false, username: null },
    authMode: "login",
    credentials: {},
    statusType: null,
    statusMessage: "",
  };

  const root = document.getElementById("root");

  function esc(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function setStatus(type, msg) {
    state.statusType = type;
    state.statusMessage = msg;
    const box = document.getElementById("statusBox");
    if (box) {
      box.className = "status-box " + (type || "");
      box.textContent = msg || "";
    }
  }

  function setBadge(id, kind, text) {
    const el = document.getElementById("badge-" + id);
    if (el) {
      el.className = "badge " + kind;
      el.textContent = text;
    }
  }

  /* ------------------- Initial Load ------------------- */

  async function loadInitialData() {
    try {
      const [authRes, configRes] = await Promise.all([
        app.callServerTool({ name: "panel_get_auth_state", arguments: {} }).catch(() => null),
        app.callServerTool({ name: "panel_load_config", arguments: {} }).catch(() => null),
      ]);

      if (authRes) {
        state.auth = JSON.parse(authRes.content[0].text);
      }

      if (configRes) {
        const cfg = JSON.parse(configRes.content[0].text);
        state.credentials = cfg.config || {};
        if (cfg.auth && cfg.auth.isAuthenticated) {
          state.auth = cfg.auth;
        }
      }

      // Auto-authenticate if credentials are configured in server/.env
      if (!state.auth.isAuthenticated && state.credentials.AUTH_USERNAME) {
        try {
          const loginRes = await app.callServerTool({
            name: "panel_login",
            arguments: {
              username: state.credentials.AUTH_USERNAME,
              password: state.credentials.AUTH_PASSWORD || "",
            },
          });
          const loginData = JSON.parse(loginRes.content[0].text);
          if (loginData.success) {
            state.auth = { hasAccount: true, isAuthenticated: true, username: loginData.username };
          }
        } catch {}
      }
    } catch (err) {
      console.error("Initial load error:", err);
    }
    render();
  }

  /* ------------------- Render Router ------------------- */

  function render() {
    if (!state.auth.isAuthenticated) {
      renderAuth();
      return;
    }

    const cfg = state.credentials;
    root.innerHTML = `
      <div class="header">
        <h2>⚡ Credentials & Service Connections</h2>
        <div class="header-actions">
          <span class="user-badge">👤 ${esc(state.auth.username || "admin")}</span>
          <button class="btn-signout" id="signoutBtn">Sign out</button>
        </div>
      </div>
      <p class="sub">Configure API tokens, database connections, and credentials stored securely in server/.env.</p>

      <!-- GitHub -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🐙 GitHub</span>
          <span class="badge idle" id="badge-github">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="githubToken">Personal Access Token (classic or fine-grained)</label>
          <input type="password" id="githubToken" placeholder="ghp_… or github_pat_…" value="${esc(cfg.GITHUB_TOKEN || '')}" />
        </div>
      </div>

      <!-- Notion -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">📝 Notion</span>
          <span class="badge idle" id="badge-notion">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="notionKey">Internal Integration Token</label>
          <input type="password" id="notionKey" placeholder="secret_…" value="${esc(cfg.NOTION_API_KEY || '')}" />
        </div>
      </div>

      <!-- Qdrant -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🧠 Qdrant Vector DB</span>
          <span class="badge idle" id="badge-qdrant">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="qdrantUrl">Cluster Endpoint URL</label>
          <input type="text" id="qdrantUrl" placeholder="https://xxx.cloud.qdrant.io" value="${esc(cfg.QDRANT_URL || '')}" />
        </div>
        <div class="field-group" style="margin-top:8px;">
          <label class="field-label" for="qdrantKey">API Key (optional for local clusters)</label>
          <input type="password" id="qdrantKey" placeholder="Qdrant API Key" value="${esc(cfg.QDRANT_API_KEY || '')}" />
        </div>
      </div>

      <!-- Gemini Embeddings -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">✨ Google Gemini Embedding</span>
          <span class="badge idle" id="badge-gemini">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="geminiKey">Gemini API Key (Google AI Studio)</label>
          <input type="password" id="geminiKey" placeholder="AIzaSy…" value="${esc(cfg.GEMINI_API_KEY || '')}" />
        </div>
      </div>

      <!-- SQL Database -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🗄️ SQL Database</span>
          <span class="badge idle" id="badge-sql">Not tested</span>
        </div>
        <div class="field-group">
          <label class="field-label" for="databaseUrl">Connection URI (PostgreSQL, MySQL, SQLite)</label>
          <input type="text" id="databaseUrl" placeholder="postgresql://user:pass@host:5432/dbname" value="${esc(cfg.DATABASE_URL || '')}" />
        </div>
      </div>

      <div class="btn-row">
        <button class="primary" id="saveCredentialsBtn">Save & Connect</button>
        <button class="secondary" id="testConnectionsBtn">Test Connections</button>
      </div>

      <div id="statusBox" class="${state.statusType ? 'status-box ' + state.statusType : 'status-box'}">${esc(state.statusMessage)}</div>
    `;

    document.getElementById("signoutBtn")?.addEventListener("click", handleSignout);
    document.getElementById("testConnectionsBtn")?.addEventListener("click", runConnectionTests);
    document.getElementById("saveCredentialsBtn")?.addEventListener("click", saveAllCredentials);
  }

  /* ------------------- Auth View ------------------- */

  function renderAuth() {
    const isLogin = state.authMode === "login";
    root.innerHTML = `
      <div class="header">
        <h2>⚡ Credentials Access</h2>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">🔐 ${isLogin ? "Sign In" : "Create Account"}</span>
        </div>
        <p style="color:var(--muted);font-size:12.5px;margin:0 0 12px;">
          ${isLogin ? "Enter credentials to access your team configuration." : "Create account credentials stored in server/.env."}
        </p>
        <div class="field-group">
          <label class="field-label" for="authUsername">Username</label>
          <input type="text" id="authUsername" placeholder="username" value="${esc(state.credentials.AUTH_USERNAME || '')}" />
        </div>
        <div class="field-group" style="margin-top:8px;">
          <label class="field-label" for="authPassword">Password</label>
          <input type="password" id="authPassword" placeholder="••••••••" value="${esc(state.credentials.AUTH_PASSWORD || '')}" />
        </div>
        <div class="btn-row">
          <button class="primary" id="authSubmitBtn">${isLogin ? "Sign In" : "Create Account"}</button>
          <button class="secondary" id="authToggleBtn">Switch to ${isLogin ? "Create Account" : "Sign In"}</button>
        </div>
        <div id="statusBox" class="${state.statusType ? 'status-box ' + state.statusType : 'status-box'}">${esc(state.statusMessage)}</div>
      </div>
    `;

    document.getElementById("authToggleBtn")?.addEventListener("click", () => {
      state.authMode = state.authMode === "login" ? "register" : "login";
      render();
    });

    document.getElementById("authSubmitBtn")?.addEventListener("click", handleAuthSubmit);
  }

  async function handleAuthSubmit() {
    const username = document.getElementById("authUsername")?.value.trim();
    const password = document.getElementById("authPassword")?.value.trim();
    if (!username || !password) {
      setStatus("err", "Username and password are required.");
      return;
    }
    const toolName = state.authMode === "login" ? "panel_login" : "panel_create_account";
    try {
      const res = await app.callServerTool({ name: toolName, arguments: { username, password } });
      const data = JSON.parse(res.content[0].text);
      if (data.success) {
        state.auth = { hasAccount: true, isAuthenticated: true, username: data.username || username };
        await loadInitialData();
      } else {
        setStatus("err", data.reason || "Authentication failed.");
      }
    } catch (err) {
      setStatus("err", err.message);
    }
  }

  async function handleSignout() {
    try {
      await app.callServerTool({ name: "panel_signout", arguments: {} });
    } catch {}
    state.auth = { hasAccount: true, isAuthenticated: false, username: null };
    render();
  }

  /* ------------------- Connections & Saving ------------------- */

  function getCredentialsFormValues() {
    return {
      GITHUB_TOKEN: document.getElementById("githubToken")?.value.trim() || "",
      NOTION_API_KEY: document.getElementById("notionKey")?.value.trim() || "",
      QDRANT_URL: document.getElementById("qdrantUrl")?.value.trim() || "",
      QDRANT_API_KEY: document.getElementById("qdrantKey")?.value.trim() || "",
      GEMINI_API_KEY: document.getElementById("geminiKey")?.value.trim() || "",
      DATABASE_URL: document.getElementById("databaseUrl")?.value.trim() || "",
    };
  }

  async function runConnectionTests() {
    const vals = getCredentialsFormValues();
    setStatus(null, "");
    setBadge("github", "idle", "Testing…");
    setBadge("notion", "idle", "Testing…");
    setBadge("qdrant", "idle", "Testing…");
    setBadge("gemini", "idle", "Testing…");
    setBadge("sql", "idle", "Testing…");

    let errors = [];

    if (vals.GITHUB_TOKEN) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "github", githubToken: vals.GITHUB_TOKEN } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok || d.valid) setBadge("github", "ok", "✓ " + (d.login || "Connected"));
        else { setBadge("github", "err", "Failed"); errors.push("GitHub: " + (d.reason || "Failed")); }
      } catch (e) { setBadge("github", "err", "Error"); }
    } else setBadge("github", "idle", "Empty");

    if (vals.NOTION_API_KEY) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "notion", notionApiKey: vals.NOTION_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok || d.valid) setBadge("notion", "ok", "✓ " + (d.botName || "Connected"));
        else { setBadge("notion", "err", "Failed"); errors.push("Notion: " + (d.reason || "Failed")); }
      } catch (e) { setBadge("notion", "err", "Error"); }
    } else setBadge("notion", "idle", "Empty");

    if (vals.QDRANT_URL) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "qdrant", qdrantUrl: vals.QDRANT_URL, qdrantApiKey: vals.QDRANT_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok || d.valid) setBadge("qdrant", "ok", "✓ Connected (" + (d.collectionsCount || 0) + " col)");
        else { setBadge("qdrant", "err", "Failed"); errors.push("Qdrant: " + (d.reason || "Failed")); }
      } catch (e) { setBadge("qdrant", "err", "Error"); }
    } else setBadge("qdrant", "idle", "Empty");

    if (vals.GEMINI_API_KEY) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "gemini", geminiApiKey: vals.GEMINI_API_KEY } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok || d.valid) setBadge("gemini", "ok", "✓ " + (d.model || "Connected"));
        else { setBadge("gemini", "err", "Failed"); errors.push("Gemini: " + (d.reason || "Failed")); }
      } catch (e) { setBadge("gemini", "err", "Error"); }
    } else setBadge("gemini", "idle", "Empty");

    if (vals.DATABASE_URL) {
      try {
        const res = await app.callServerTool({ name: "panel_test_connection", arguments: { service: "sql", databaseUrl: vals.DATABASE_URL } });
        const d = JSON.parse(res.content[0].text);
        if (d.ok || d.valid) setBadge("sql", "ok", "✓ " + (d.dialect || "Connected"));
        else { setBadge("sql", "err", "Failed"); errors.push("SQL: " + (d.reason || "Failed")); }
      } catch (e) { setBadge("sql", "err", "Error"); }
    } else setBadge("sql", "idle", "Empty");

    if (errors.length > 0) setStatus("err", errors.join(" | "));
    else setStatus("ok", "✓ All active connections tested successfully!");
  }

  async function saveAllCredentials() {
    const vals = getCredentialsFormValues();
    const btn = document.getElementById("saveCredentialsBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";
    setStatus(null, "");

    await runConnectionTests();

    try {
      const res = await app.callServerTool({ name: "panel_save_all_credentials", arguments: vals });
      const data = JSON.parse(res.content[0].text);
      if (data.status === "ok") {
        state.credentials = vals;
        setStatus("ok", "✓ Credentials saved successfully to server/.env and OS keychain!");
      } else {
        setStatus("err", data.message || "Failed to save credentials.");
      }
    } catch (err) {
      setStatus("err", "Error: " + err.message);
    }
    btn.disabled = false;
    btn.textContent = "Save & Connect";
  }

  /* ------------------- Boot ------------------- */
  await app.connect();
  await loadInitialData();
</script>
