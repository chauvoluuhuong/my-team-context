<div id="root" class="panel">
  <div class="loading">Loading team skills & knowledge base…</div>
</div>

<style>
  :root {
    --bg: #ffffff;
    --fg: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --ok-bg: #ecfdf5;
    --ok-fg: #059669;
    --warn-bg: #fffbeb;
    --warn-fg: #d97706;
    --err-bg: #fef2f2;
    --err-fg: #dc2626;
    --code-bg: #f8fafc;
    --card-bg: #ffffff;
    --card-hover: #f9fafb;
    --border: #e2e8f0;
    --purple-bg: #f3e8ff;
    --purple-fg: #7e22ce;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --line: #334155;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #1e293b;
      --ok-bg: #064e3b;
      --ok-fg: #34d399;
      --warn-bg: #78350f;
      --warn-fg: #fbbf24;
      --err-bg: #7f1d1d;
      --err-fg: #f87171;
      --code-bg: #1e293b;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --border: #334155;
      --purple-bg: #3b0764;
      --purple-fg: #d8b4fe;
    }
  }

  * { box-sizing: border-box; }

  .panel {
    background: var(--bg);
    color: var(--fg);
    font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    max-width: 680px;
    margin: 0 auto;
  }

  .loading { color: var(--muted); padding: 24px 0; text-align: center; }

  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .badge.idle { background: var(--line); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.err { background: var(--err-bg); color: var(--err-fg); }
  .badge.score { background: var(--purple-bg); color: var(--purple-fg); }

  input[type="text"], input[type="password"], textarea {
    width: 100%;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--code-bg);
    color: var(--fg);
  }
  textarea {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 12.5px;
    resize: vertical;
    min-height: 120px;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--card-bg);
    color: var(--fg);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  button.danger {
    background: var(--err-bg);
    border-color: var(--err-bg);
    color: var(--err-fg);
  }
  button.sm {
    padding: 4px 8px;
    font-size: 11.5px;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }

  .status-box {
    margin: 12px 0;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-box.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .status-box.err { background: var(--err-bg); color: var(--err-fg); }
  .status-box.warn { background: var(--warn-bg); color: var(--warn-fg); }

  .spinner-sm {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid currentColor;
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<script>
  /*__EXT_APPS_BUNDLE__*/
</script>

<script type="module">
  /*__SKILLS_COMPONENT__*/

  const { App } = globalThis.ExtApps || {};
  const app = new App({ name: "TeamSkillsManagement", version: "1.0.0" }, {}, { autoResize: true });

  const root = document.getElementById("root");
  const component = new globalThis.SkillsComponent({
    app,
    container: root,
    showHeader: true,
  });

  app.ontoolresult = async ({ content }) => {
    try {
      const data = JSON.parse(content[0].text);
      if (Array.isArray(data.skills)) {
        component.skills = data.skills;
        component.render();
      }
    } catch {
      await component.loadSkills();
    }
  };

  await app.connect();
  await component.loadSkills();
</script>
